<!-- Schaubild „Der Kreislauf“ (id kausalkette, v1.3.20, Fassung v3; Start-Karte entfällt, Einladungskarte in k03) – berichte/code-v1319-kreislauf-v3.md · Texte: spec/09a_schaubild-kreislauf-v3-texte.md
     Modell: Einflussfeld statt Ring. Hühnerstall + Social Media wirken gleichzeitig und dauerhaft → Türsteher → Gedanken ↔ Körper & Energie;
     Rückweg Körper & Energie → Handy-Griff → Social Media. Kern: Energieanzeige + Körperbild.
     Körperbild: 6 deckungsgleiche Stufen (0 ruhig, 1 leicht besorgt, 2 angespannt, 3 Alarm, 4 erschöpft, 5 erholt), Mischung per opacity.
     Abwärts: 0 → 1 → 2 → 3 → 4 · Aufwärts (bewusst): 4 → 1 → 0 → 5. -->
<style>
:root{color-scheme:dark;--bg-deep:#0f1923;--bg-card:#162230;--accent:#f97316;--accent-glow:rgba(249,115,22,.25);--accent-soft:#fb923c;--text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;--border:rgba(148,163,184,.12);--healthy:#7DD3C0;--toxic-red:#B41928;--radius:16px;--flow:1.1s;
  --font-h:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;--font-t:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:clip;max-width:100%}
body{font-family:var(--font-t);background:var(--bg-deep);color:var(--text-primary);min-height:100dvh;-webkit-tap-highlight-color:transparent}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(249,115,22,.06),transparent 50%);pointer-events:none;z-index:0}
.app{position:relative;z-index:1;height:calc(100vh - var(--kk-h));height:calc(100dvh - var(--kk-h));display:flex;flex-direction:column;align-items:center;padding:6px 14px calc(10px + env(safe-area-inset-bottom,0px));gap:6px}
.grafik{flex:1 1 auto;min-height:0;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:6px}

/* Umschalter Gesamtbild */
.schalter{display:flex;flex-direction:column;align-items:center;gap:5px;flex:0 0 auto;max-width:100%}
.schalter .knoepfe{display:flex;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:3px;gap:3px;max-width:100%}
.schalter button{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:0 .9rem;border-radius:11px;font:700 .95rem/1 var(--font-h);color:var(--text-secondary);touch-action:manipulation;white-space:nowrap}
.schalter button svg{width:20px;height:20px;flex:0 0 20px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.schalter button[aria-pressed="true"]#s-auto{background:rgba(249,115,22,.18);color:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.schalter button[aria-pressed="true"]#s-bew{background:rgba(125,211,192,.16);color:var(--healthy);box-shadow:inset 0 0 0 1.5px var(--healthy)}
.schalter button:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
.schalter-zeile{font-size:.8rem;line-height:1.3;color:var(--text-muted);text-align:center}

/* Netz */
.netz{flex:1 1 auto;min-height:0;width:100%;height:100%;display:block;overflow:visible}
.kante{fill:none;stroke:rgba(148,163,184,.22);stroke-width:1.8;stroke-linecap:round;transition:stroke .35s,opacity .35s,stroke-width .5s}
.kante.an{stroke:var(--accent);stroke-dasharray:5 6;animation:fluss var(--flow) linear infinite}
.kante.gr{stroke:var(--healthy);stroke-dasharray:5 6;animation:fluss 1.6s linear infinite}
.kante.leise{opacity:.45}
.kante.bruch{stroke:rgba(148,163,184,.4);stroke-dasharray:2 7;animation:none}
.still .kante{animation:none!important}
@keyframes fluss{to{stroke-dashoffset:-22}}
.knoten .r{fill:var(--bg-card);stroke:rgba(148,163,184,.28);stroke-width:1.6;transition:stroke .3s,fill .3s}
.knoten .ic{fill:none;stroke:var(--text-muted);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.knoten .t{font:600 12.5px var(--font-h);fill:var(--text-secondary);transition:fill .3s}
.knoten .u{font:500 10.5px var(--font-t);fill:var(--text-muted);transition:fill .3s}
.knoten{transition:opacity .4s}
.knoten.an .r{stroke:var(--accent);fill:rgba(249,115,22,.16)}
.knoten.an .ic{stroke:var(--accent-soft)}
.knoten.an .t{fill:var(--text-primary)}
.knoten.an .u{fill:var(--accent-soft)}
.knoten.gr .r{stroke:var(--healthy);fill:rgba(125,211,192,.14)}
.knoten.gr .ic{stroke:var(--healthy)}
.knoten.gr .t{fill:var(--text-primary)}
.knoten.gr .u{fill:var(--healthy)}
.knoten.leise{opacity:.6}
.knoten.dim{opacity:.35}
.knoten.blitz .r{fill:rgba(249,115,22,.45)}
.knoten.gr.blitz .r{fill:rgba(125,211,192,.4)}
#k-tuer image{opacity:.6;transition:opacity .3s}
#k-tuer.an image,#k-tuer.gr image{opacity:1}
/* „wirkt immer“: leiser Dauerpuls */
.immer{fill:none;stroke:var(--accent-soft);stroke-width:1.4;opacity:0;transform-box:fill-box;transform-origin:center;animation:immer 2.6s ease-out infinite}
.knoten.gr .immer{stroke:var(--healthy)}
.knoten.leise .immer{animation-duration:4.2s}
.knoten.dim .immer,.knoten.ohnepuls .immer{animation:none;opacity:0}
@keyframes immer{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.55);opacity:0}}
/* Körper & Energie */
.ring-k{fill:none;stroke-width:3.2;transition:stroke .7s}
.glow-k{fill:none;stroke-width:10;opacity:.18;transition:stroke .7s}
.koerperbild image{transition:opacity .7s ease}
.seg-bg{fill:rgba(148,163,184,.1);stroke:rgba(148,163,184,.25);stroke-width:1}
.seg{transform-box:fill-box;transform-origin:center bottom;transition:transform .7s ease,fill .7s}
.e-t{font:700 11px var(--font-h);fill:var(--text-secondary);letter-spacing:.04em}
#k-koerper .t{font-size:14px}
.knoten.weg{opacity:0;pointer-events:none}
#k-buch .r{fill:var(--bg-deep)}
/* EKG */
.ekg-lauf{animation:ekg 2.4s linear infinite}
@keyframes ekg{from{transform:translateX(0)}to{transform:translateX(-200px)}}
.ekg-linie{fill:none;stroke:#7DD3C0;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round;transition:stroke 1.4s ease}
.ekg-schatten{fill:none;stroke:rgba(15,25,35,.75);stroke-width:4.5;stroke-linejoin:round;stroke-linecap:round}

/* Körper-Rahmen-Puls (klasse .kpuls auf #k-koerper) */
.ring-k,.glow-k{transform-box:fill-box;transform-origin:center}
.kpuls .ring-k{animation:kpR .6s ease-out}
.kpuls .glow-k{animation:kpG .6s ease-out}
@keyframes kpR{0%{transform:scale(1);stroke-width:3.2}35%{transform:scale(1.045);stroke-width:5.5}100%{transform:scale(1);stroke-width:3.2}}
@keyframes kpG{0%{opacity:.18}35%{opacity:.55}100%{opacity:.18}}
@keyframes kpH{0%,100%{opacity:1}40%{opacity:.35}}
/* Anhalten (Autopilot-Phase) */
.pause .kante,.pause .immer,.pause .ekg-lauf,.pause .ring-k,.pause .glow-k{animation-play-state:paused!important}
.pausezeile{margin-top:.5rem;display:flex;justify-content:center}
.pausebtn{gap:9px;min-height:46px;padding:.6rem 1.2rem;border:2px solid rgba(241,245,249,.38);border-radius:12px;background:rgba(148,163,184,.1);color:var(--text-primary);font:700 .95rem/1 var(--font-h);cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center}
.pausebtn svg{width:18px;height:18px;flex:0 0 18px;fill:currentColor}
.pausebtn:focus-visible{outline:2px solid var(--accent-soft);outline-offset:3px}
.pausebtn[aria-pressed="true"]{border-color:var(--healthy);color:var(--healthy);background:rgba(125,211,192,.1)}

/* Textkarte */
.karte{flex:0 0 auto;width:100%;max-width:440px;min-height:236px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;overflow-y:auto;max-height:52dvh}
.karte .lbl{font:700 .7rem/1.2 var(--font-h);color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.3rem}
.karte h2{font:700 clamp(1.12rem,4.8vw,1.35rem)/1.2 var(--font-h);letter-spacing:-.02em;margin-bottom:.35rem}
.karte h2 .a{color:var(--accent)}
.karte h2 .g{color:var(--healthy)}
.karte h2.big{font-size:2.4rem;color:var(--accent)}
.karte p{color:var(--text-secondary);font-size:15px;line-height:1.5;max-width:400px}
.karte p+p{margin-top:.45rem}
.karte p strong{color:var(--text-primary)}
.karte p.mini{font-size:13px;color:var(--text-muted);margin-top:.45rem}
.fade{animation:ein .35s ease}
@keyframes ein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:auto;padding-top:.7rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.75rem 1.3rem;border:2px solid var(--accent);border-radius:12px;background:rgba(249,115,22,.12);color:var(--text-primary);font:700 1rem/1 var(--font-h);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:background .2s,box-shadow .2s,transform .1s}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--accent-soft);outline-offset:3px}
.btn.pulse{animation:cta 2s ease-in-out infinite}
@keyframes cta{0%,100%{box-shadow:0 0 0 0 var(--accent-glow)}50%{box-shadow:0 0 16px 3px var(--accent-glow)}}
.btn.gruen{border-color:var(--healthy);background:rgba(125,211,192,.12);color:var(--healthy)}
.btn.gruen.pulse{animation:ctag 2s ease-in-out infinite}
@keyframes ctag{0%,100%{box-shadow:0 0 0 0 rgba(125,211,192,.3)}50%{box-shadow:0 0 16px 3px rgba(125,211,192,.3)}}
.btn.sek{border-color:rgba(148,163,184,.3);background:transparent;color:var(--text-secondary);font-weight:600}
.btn.aus{opacity:.45;pointer-events:none}
.halten{position:relative;overflow:hidden;border-color:var(--toxic-red);background:rgba(180,25,40,.18)}
.halten .fill{position:absolute;inset:0;background:rgba(125,211,192,.35);transform-origin:left center;transform:scaleX(0);pointer-events:none}
.halten.aktiv .fill{transition:transform 2s linear;transform:scaleX(1)}
.halten span{position:relative}
/* Mini-Reset 3-2-1 */
.sinne{display:flex;gap:6px;justify-content:center;margin-top:.55rem;transition:opacity .3s ease}
.sinne.aus{opacity:0}
.sinn{width:72px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-muted);font:700 .72rem/1.1 var(--font-h)}
.sinn .kr{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;background:var(--bg-deep);transition:all .3s}
.sinn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sinn.ok{color:var(--healthy)}
.sinn.ok .kr{border-color:var(--healthy);background:rgba(125,211,192,.14);box-shadow:0 0 10px rgba(125,211,192,.25)}
.sinn.jetzt{color:var(--text-primary)}
.sinn.jetzt .kr{border-color:var(--healthy);transform:scale(1.12)}
/* Auto-Karte */
.lauf{width:100%;max-width:300px;margin-top:auto;padding-top:.7rem;display:flex;flex-direction:column;align-items:center;gap:5px}
.lauf .bar{display:block;width:100%;height:4px;border-radius:4px;background:rgba(148,163,184,.18);overflow:hidden}
.lauf .bar i{display:block;height:100%;width:0;background:var(--accent-soft);border-radius:4px}
body.bewusst .lauf .bar i{background:var(--healthy)}
.lauf .lt{font-size:.75rem;color:var(--text-muted)}
.karte.tippbar{cursor:pointer}
[hidden]{display:none!important}
@media (max-height:560px) and (orientation:portrait){.app{height:auto;min-height:calc(100dvh - var(--kk-h))}.grafik{flex:0 0 auto;height:300px}.karte{position:sticky;bottom:0;max-height:none}}
.karte.ende .btns{flex-wrap:nowrap}
.karte.ende .btn{padding:.7rem .95rem}

@media (orientation:landscape) and (min-width:900px){
  .app{flex-direction:row;justify-content:center;align-items:center;gap:20px;padding:14px 20px}
  .grafik{max-width:440px;height:100%}
  .karte{max-width:380px;min-height:300px;max-height:calc(100dvh - var(--kk-h) - 28px)}
}
@media (max-height:680px){.karte{min-height:224px;padding:10px 12px}.karte h2{margin-bottom:.25rem}.btn{min-height:44px;padding:.65rem 1.1rem}.sinne{margin-top:.35rem}}
@media (prefers-reduced-motion:reduce){
  .kante.an,.kante.gr,.immer,.btn.pulse,.btn.gruen.pulse,.fade{animation:none!important}
  .immer{opacity:0}
  .ekg-lauf{animation:none!important}
  .kpuls .ring-k{animation:kpH .6s ease-out!important}
  .sinne{transition:none}
  .koerperbild image,.seg,.ring-k,.glow-k{transition-duration:.2s}
}
</style>

function zeigeMix(a, b, x){
  if (b === undefined || a === b) { b = a; x = 0; }

}

const AUF = [[0.5, 4], [2.5, 1], [4, 0], [5, 5]];

const VERLAUF = [[0.8, [224,65,79]], [1.6, [249,115,22]], [3, [251,146,60]], [4.2, [125,211,192]]];
function farbeWeich(e){
  if (e <= VERLAUF[0][0]) return `rgb(${VERLAUF[0][1]})`;
  for (let i = 0; i < VERLAUF.length - 1; i++){
    const [a, ca] = VERLAUF[i], [b, cb] = VERLAUF[i + 1];
    if (e <= b){ const x = (e - a) / (b - a); return `rgb(${ca.map((v, k) => Math.round(v + (cb[k] - v) * x)).join(',')})`; }
  }

}

      else barAn(pt.rest);
    };
    const weiter = () => { if (fertig) return; fertig = true; pt.cancel(); if (BARSYNC === sync) BARSYNC = null; karte.removeEventListener('click', weiter); karte.classList.remove('tippbar'); res(); };
    const pt = ptimer(ms, weiter);
    if (pausierbar) BARSYNC = sync; else if (BARSYNC) BARSYNC = null;
    if (!PAUSE) barAn(ms);
    setTimeout(() => { if (!fertig) karte.addEventListener('click', weiter); }, 60);
  });
}

/* =================== Phase 0: Start (direkt Runde 1, Karte 1; keine Start-Karte mehr, v1.3.20) =================== */
function start(){
  lauf++; ZUG = false; setPause(false);
  document.body.classList.remove('bewusst');
  $('schalter').hidden = true; karte.classList.remove('ende');
  root.setProperty('--flow', '1.8s');
  ['kH','hM'].forEach(id => KE[id].style.strokeWidth = '');
  netzReset(); unterAlle(TEXTE.unter.start);
  kn('stall', 'leise'); kn('sm', 'leise');
  energie(5); energieUnter();
  runde1(0);
  window.scrollTo(0, 0);
}

/* =================== Phase 1: Runde 1 (4 Taps) =================== */
const SCHRITT1 = [
  async t => { kn('stall','an'); kn('sm','an'); ka('sT','an'); ka('mT','an'); blitz(['stall','sm']); },
  async t => { kn('tuer','an'); blitz(['tuer']); energie(4.5); energieUnter(); await wait(650); if (t !== lauf) return; ka('tG','an'); kn('ged','an'); blitz(['ged']); unter('ged', '„Ich fall eh durch.“'); },
  async t => { ka('gK','an'); kn('koerper','an'); blitz(['koerper']); energie(4); await wait(700); if (t !== lauf) return; energie(3); energieUnter(); },
  async t => { ka('kH','an'); kn('handy','an'); blitz(['handy']); await wait(650); if (t !== lauf) return; ka('hM','an'); blitz(['sm']); energie(2); energieUnter(); }
];
function runde1(i){
  const t = ++lauf;
  SCHRITT1[i](t);
  const letzt = i === SCHRITT1.length - 1;
  zeige({...TEXTE.runde1[i], btns:[{t: letzt ? TEXTE.weiterLetzt : TEXTE.weiter, on:() => letzt ? autopilot() : runde1(i + 1)}]});
}

/* =================== Phase 2: Autopilot (ruhig starten, dann schneller) =================== */
const WELLE = [['stall','sm'], ['tuer'], ['ged'], ['koerper'], ['handy']];
let tempo = 900;
async function wellen(t){ while (t === lauf){ for (const g of WELLE){ if (t !== lauf) return; blitz(g); await wait(tempo); } await wait(REDUZIERT ? 400 : 200); } }
async function autopilot(){
  const t = ++lauf; setPause(false);
  Object.keys(KN).forEach(id => { if (id !== 'buch') kn(id, 'an'); }); Object.keys(KE).forEach(id => ka(id, 'an'));
  const TEMPO = [950, 700, 500, 360], FLOW = ['1.8s', '1.3s', '.95s', '.7s'], EN = [1.5, 1, 0.6, 0.4];
  tempo = TEMPO[0]; wellen(t);
  for (let r = 0; r < TEXTE.auto.length; r++){
    if (t !== lauf) return;
    tempo = TEMPO[r];
    root.setProperty('--flow', REDUZIERT ? '1.8s' : FLOW[r]);
    ['kH','hM'].forEach(id => KE[id].style.strokeWidth = 1.8 + r * 0.55);   /* Rückweg wird breiter + schneller */
    energie(EN[r]); energieUnter();
    if (r === 2) unter('koerper', 'Dauerstress');
    await zeigeAuto(TEXTE.auto[r], undefined, true);
  }
  if (t !== lauf) return;
  setPause(false);
  tempo = REDUZIERT ? 600 : 300;
  haltenAnbieten();
}
function haltenAnbieten(){
  const [b] = zeige({h:TEXTE.halten.h, p:TEXTE.halten.p, btns:[{t:`<span class="fill"></span><span>${TEXTE.halten.btn}</span>`, k:'halten'}]});
  b.setAttribute('aria-label', TEXTE.halten.aria);
  let timer = null;
  const taste = e => /^( |Enter|Spacebar)$/.test(e.key);
  const los = e => {
    if (timer) return;
    if (e.type === 'keydown' && !taste(e)) return;
    if (e.cancelable) e.preventDefault();
    b.classList.add('aktiv'); timer = setTimeout(() => { timer = null; stopp(); }, 2000);
  };
  const ab = e => { if (!timer) return; if (e && e.type === 'keyup' && !taste(e)) return; clearTimeout(timer); timer = null; b.classList.remove('aktiv'); };
  b.addEventListener('pointerdown', los);
  ['pointerup','pointerleave','pointercancel','blur','keyup'].forEach(ev => b.addEventListener(ev, ab));
  b.addEventListener('keydown', los);
  b.addEventListener('click', e => e.preventDefault());
  b.addEventListener('contextmenu', e => e.preventDefault());
}
function stopp(){
  lauf++; setPause(false);
  $('netz').classList.add('still');
  const [b] = zeige({h:TEXTE.stopp.h, hKlasse:'big', p:TEXTE.stopp.p, btns:[{t:TEXTE.stopp.btn, k:'gruen', on:() => resetKarte(1)}]});
  b.focus({preventScroll:true});
}

/* =================== Phase 3: bewusste Runden =================== */
const SINN_IC = [
  '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/>',
  '<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11V4.5a1.5 1.5 0 0 1 3 0V12"/><path d="M14 11.5V6a1.5 1.5 0 0 1 3 0v7.5a6.5 6.5 0 0 1-6.5 6.5h-.6a6 6 0 0 1-4.6-2.2L3.6 15a1.6 1.6 0 0 1 2.4-2l2 2"/>',
  '<path d="M6 9.5a6 6 0 1 1 12 0c0 3.5-3 4.2-3 7a3 3 0 0 1-5.2 2"/><path d="M9.5 9.5a2.5 2.5 0 0 1 5 0"/>'
];
/* jetzt = aktueller Sinn (−1 = keiner, 3 = alle erledigt) */
const sinneHTML = (jetzt = -1) => `<div class="sinne" aria-hidden="true">${TEXTE.sinne.map((lb, i) => `<div class="sinn${i < jetzt ? ' ok' : i === jetzt ? ' jetzt' : ''}"><span class="kr"><svg viewBox="0 0 24 24">${SINN_IC[i]}</svg></span>${lb}</div>`).join('')}</div>`;
/* Energieverlauf: nach Mini-Reset / nach Körper-Schritt / nach Rückfall */
const STAND = {1:{reset:1.1, fokus:2.1, rueck:1.7}, 2:{reset:2.3, fokus:3.3, rueck:2.9}, 3:{reset:3.6, fokus:5}};
/* Während des Mini-Resets: alles grau und still */
function grauStill(){
  $('netz').classList.add('still');
  Object.keys(KN).forEach(id => kn(id, 'leise'));
  kn('buch', 'weg');
  Object.keys(KE).forEach(id => ka(id, 'leise'));
  ka('kH', 'bruch'); ka('hM', 'bruch'); kn('handy', 'dim');
  unter('handy', TEXTE.unter.reset.handy);
}
function resetKarte(p){
  lauf++;
  document.body.classList.add('bewusst');
  if (p === 1){
    ['kH','hM'].forEach(id => KE[id].style.strokeWidth = '');
    root.setProperty('--flow', '1.8s');
  }
  zeige({...TEXTE.reset[p], extra:sinneHTML(), btns:[{t:TEXTE.resetBtn, k:'gruen pulse', on:() => miniReset(p)}]});
}
async function miniReset(p){
  const t = ++lauf;
  ZUG = false;
  grauStill(); ekg();
  for (let i = 0; i < 3; i++){
    const o = {lbl:`${TEXTE.sinnLbl} ${i + 1}/3`, ...TEXTE.sinnSchritte[i], extra:sinneHTML(i)};
    if (p === 1) await zeigeTap(o, TEXTE.sinnBtn);      /* Runde 1: jeden Sinn selbst bestätigen */
    else await zeigeAuto(o, 3000);                      /* Runden 2 + 3: je 3 s, tippen = weiter */
    if (t !== lauf) return;
  }
  energie(STAND[p].reset, 'auf'); energieUnter();
  zeige({...TEXTE.nachReset[p], extra:REDUZIERT ? '' : sinneHTML(3), btns:[{t:TEXTE.fokusBtn, k:'gruen pulse', on:() => fokus(p, 0)}]});
  const sn = karte.querySelector('.sinne');   /* Mini-Reset fertig: Symbole blenden aus, Fokus-Button rückt in den Blick */
  if (sn){ requestAnimationFrame(() => requestAnimationFrame(() => sn.classList.add('aus'))); setTimeout(() => { sn.hidden = true; }, 330); }
}
/* Fokus bewusst neu ausrichten: 4 Schritte, jeder mit eigenem Tap */
function fokus(p, s){
  const t = ++lauf;
  if (s === 0){
    $('netz').classList.remove('still');
    kn('stall', 'an', 'leise'); ka('sT', 'an', 'leise'); unter('stall', TEXTE.unter.bewusst.stall);
    kn('tuer', 'gr'); blitz(['tuer']); unter('tuer', TEXTE.fokusUnter[p].tuer);
  } else if (s === 1){
    ka('tG', 'gr'); kn('ged', 'gr'); blitz(['ged']); unter('ged', TEXTE.fokusUnter[p].ged);
  } else if (s === 2){
    ka('gK', 'gr'); kn('koerper', 'gr'); blitz(['koerper']);
    energie(STAND[p].fokus, 'auf'); energieUnter();
  } else {
    tealWeg(); blitz(['handy', 'buch', 'sm']);
  }
  const txt = TEXTE.fokus[p][s];
  const weiter = s < TEXTE.fokus[p].length - 1 ? () => fokus(p, s + 1) : (p < 3 ? () => rueckfall(p) : schluss);
  zeige({lbl:`Bewusst ${p}/3 · ${TEXTE.fokusLbl[s]}`, ...txt, btns:[{t:TEXTE.weiter, k:'gruen', on:weiter}]});
}
function schluss(){
  lauf++;
  zeige({...TEXTE.schluss, btns:[{t:TEXTE.schluss.btn, k:'gruen', on:gesamtbild}]});
}
function rueckfall(p){
  /* der Autopilot zieht wieder: Social Media / Handy-Weg orange, Energie sinkt etwas */
  ZUG = true;
  kn('buch', 'weg');
  kn('sm', 'an'); ka('mT', 'an'); ka('hM', 'an'); ka('kH', 'an'); kn('handy', 'an');
  unter('sm', 'wirkt immer'); unter('handy', TEXTE.unter.start.handy);
  if (p === 1){
    blitz(['sm', 'handy']);
  } else {
    kn('sm', 'an', 'leise'); ka('mT', 'an', 'leise'); ka('hM', 'an', 'leise'); ka('kH', 'an', 'leise');
    kn('stall', 'an'); ka('sT', 'an'); unter('stall', 'wirkt immer');
    kn('tuer', 'an'); ka('tG', 'an'); unter('tuer', TEXTE.unter.start.tuer); blitz(['stall', 'tuer']);
  }
  energie(STAND[p].rueck, 'auf'); energieUnter();
  resetKarte(p + 1);
}

/* =================== Phase 4: Gesamtbild =================== */
function ansicht(modus){
  $('s-auto').setAttribute('aria-pressed', modus === 'auto');
  $('s-bew').setAttribute('aria-pressed', modus === 'bewusst');
  netzReset(); ZUG = false;
  if (modus === 'auto'){
    document.body.classList.remove('bewusst');
    root.setProperty('--flow', REDUZIERT ? '1.8s' : '.8s');
    Object.keys(KN).forEach(id => { if (id !== 'buch') kn(id, 'an'); }); Object.keys(KE).forEach(id => ka(id, 'an'));
    energie(0.4, 'ab');
  } else {
    document.body.classList.add('bewusst');
    root.setProperty('--flow', '1.8s');
    kn('stall', 'an', 'leise'); ka('sT', 'an', 'leise');
    kn('tuer', 'gr'); ka('tG', 'gr'); kn('ged', 'gr'); ka('gK', 'gr'); kn('koerper', 'gr');
    tealWeg();
    energie(5, 'auf');
  }
  unterAlle(TEXTE.gesamt[modus]);
  $('schalter-zeile').textContent = TEXTE.schalterZeile[modus];
}
function gesamtbild(){
  lauf++;
  $('schalter').hidden = false; karte.classList.add('ende');
  ansicht('bewusst');
  const E2 = TEXTE.ende;
  zeige({lbl:E2.lbl, p:E2.p1, p2:E2.p2, btns:[
    {t:E2.nochmal, k:'gruen', on:start},
    {t:E2.fertig, k:'sek', on:zurueck}
  ]});
}
function zurueck(){ if (window.parent !== window) parent.postMessage({kk:'zurueck'}, '*'); else location.href = '../../#/'; }
$('s-auto').addEventListener('click', () => ansicht('auto'));
$('s-bew').addEventListener('click', () => ansicht('bewusst'));

start();
</script>
<script>document.getElementById('kk-back').addEventListener('click',function(){if(window.parent!==window){parent.postMessage({kk:'zurueck'},'*')}else{location.href='../../#/'}});</script>
