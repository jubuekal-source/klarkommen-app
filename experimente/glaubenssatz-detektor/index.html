<style>
:root{color-scheme:dark;--bg-deep:#0f1923;--bg-card:#162230;--bg-input:#1c2e40;--accent:#f97316;--accent-soft:#fb923c;--text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;--border:rgba(148,163,184,.14);--healthy:#7DD3C0;--healthy-dark:#5BB8A5;--radius:16px;

*{margin:0;padding:0;box-sizing:border-box}

#kk-bar button:focus-visible{outline:2px solid #f97316;outline-offset:-2px;border-radius:8px}
#kk-bar #kk-samml{color:var(--healthy);font-size:14px}
body{min-height:calc(100dvh - var(--kk-h))}

main{display:flex;flex-direction:column;gap:16px;min-width:0}

.fade>*{animation:ein .3s ease-out both}
.fade>*:nth-child(2){animation-delay:.04s}.fade>*:nth-child(3){animation-delay:.08s}.fade>*:nth-child(4){animation-delay:.12s}.fade>*:nth-child(5){animation-delay:.16s}.fade>*:nth-child(n+6){animation-delay:.2s}

.lbl::before{content:'';display:inline-block;width:14px;height:2px;border-radius:1px;background:var(--healthy-dark);vertical-align:middle;margin-right:8px}
p.hell strong{color:var(--text-primary)}
p{color:var(--text-secondary);font-size:15px;line-height:1.55;overflow-wrap:anywhere}
p.klein{font-size:13px;color:var(--text-muted)}
p.hell{color:var(--text-primary);font-size:16px}
strong{color:var(--text-primary)}
.karte{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.karte.teal{border-color:rgba(125,211,192,.45);box-shadow:0 0 0 1px rgba(125,211,192,.08) inset}
.karte.fund{border-color:rgba(249,115,22,.3);border-left:4px solid var(--accent);background:linear-gradient(180deg,rgba(249,115,22,.06),transparent 60%),var(--bg-card)}
.karte.start{gap:12px;background:linear-gradient(180deg,rgba(125,211,192,.07),transparent 55%),var(--bg-card);padding:18px 16px}
.gs-bild{margin:0;border-radius:12px;overflow:hidden}.gs-bild[hidden]{display:none}.gs-bild img{display:block;width:100%;height:auto}
.karte.situation{min-height:140px;justify-content:center}
.karte.situation .text{font:600 clamp(1.05rem,4.8vw,1.25rem)/1.4 var(--font-h);color:var(--text-primary);overflow-wrap:anywhere}
.zitat{border-left:3px solid var(--healthy-dark);padding:2px 0 2px 10px;color:var(--text-secondary);font-size:14px;overflow-wrap:anywhere}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:10px 14px;border-radius:12px;font:700 15px/1.25 var(--font-h);color:var(--text-primary);background:rgba(148,163,184,.1);border:2px solid rgba(241,245,249,.28);touch-action:manipulation;width:100%;overflow-wrap:anywhere}
.btn:active,.chip:active,.wahl:active,.antw button:active,.stat:active,.item .open:active{transform:scale(.985)}
.btn:focus-visible,.chip:focus-visible,.stat:focus-visible,.item .open:focus-visible,.wahl:focus-visible,.antw button:focus-visible,.sw:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,.ikon:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
.btn.primaer{background:rgba(249,115,22,.16);border-color:var(--accent);color:#fdba74}
.btn.gruen{background:rgba(125,211,192,.14);border-color:var(--healthy);color:var(--healthy)}
.btn.signal{background:rgba(249,115,22,.14);border-color:var(--accent);color:var(--accent-soft)}
.btn[aria-disabled="true"]{opacity:.4;cursor:default}
.btn.leise{border-color:var(--border);color:var(--text-secondary);background:transparent;font-weight:600}
.btn.kompakt{min-height:44px;padding:8px 8px;font-size:14px}
.btn.zwei{flex-direction:column;align-items:center;gap:0;padding:14px}
.btn b{display:block;font:700 15px/1.25 var(--font-h)}
.btn small{display:block;font:500 13px/1.3 var(--font-t);color:var(--text-secondary);margin-top:4px}
.btn .badge{display:block;align-self:center;font:700 11px/1 var(--font-h);letter-spacing:.06em;text-transform:uppercase;color:var(--bg-deep);background:var(--healthy);border-radius:6px;padding:3px 6px;margin-bottom:6px}
.foot{display:flex;flex-direction:column;gap:8px;margin-top:6px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.zeile2{display:flex;gap:8px}
.zeile2>*{flex:1 1 0;min-width:0}
.zeile3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;flex-direction:column;gap:8px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;min-height:46px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg-card);color:var(--text-primary);font:500 15px/1.35 var(--font-t);touch-action:manipulation;overflow-wrap:anywhere;display:block;width:100%}
.chip[aria-pressed="true"]{border-color:var(--accent);background:rgba(249,115,22,.12);color:#fdba74}
.bereiche{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bereiche .chip{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:600 14px/1.3 var(--font-h);min-height:64px;gap:0}
.bereiche .chip b{display:block;font-weight:600}
.bereiche .chip small{display:block;font:400 12px/1.3 var(--font-t);color:var(--text-muted);margin-top:4px}
.bereiche .chip[aria-pressed="true"] small{color:var(--accent-soft)}
.bereiche .chip.klein{min-height:52px;font-size:13px;font-weight:500;color:var(--text-secondary);grid-column:1/-1}
.bereiche .chip.klein[aria-pressed="true"]{color:#fdba74}
.sw{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:44px;font:500 14px/1.3 var(--font-t);color:var(--text-secondary);touch-action:manipulation}
.sw .k{flex:0 0 44px;width:44px;height:26px;border-radius:13px;background:rgba(148,163,184,.25);position:relative;transition:background .2s}
.sw .k::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--text-primary);transition:transform .2s}
.sw[aria-checked="true"] .k{background:var(--healthy-dark)}
.sw[aria-checked="true"] .k::after{transform:translateX(18px)}
.antw{display:flex;flex-direction:column;gap:8px}
.antw button{all:unset;box-sizing:border-box;cursor:pointer;min-height:50px;padding:10px 14px;border-radius:12px;border:2px solid var(--border);background:var(--bg-card);color:var(--text-primary);font:700 15px/1.2 var(--font-h);text-align:center;touch-action:manipulation;display:flex;align-items:center;justify-content:center}
.antw button[aria-pressed="true"]{border-color:var(--accent);color:#fdba74;background:rgba(249,115,22,.12)}
.wahl{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;min-height:52px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg-card);color:var(--text-primary);font:500 15px/1.4 var(--font-t);touch-action:manipulation;overflow-wrap:anywhere}
.wahl[aria-checked="true"]{border-color:var(--accent);background:rgba(249,115,22,.12)}
.wahl b{display:block;font-weight:500}
.wahl .tag{display:block;font:700 11px/1.2 var(--font-h);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-top:6px}
.wahl[aria-checked="true"] .tag{color:var(--accent-soft)}
.wahl.keiner{min-height:48px;color:var(--text-secondary)}
.kzeile{display:flex;gap:8px;align-items:stretch}
.kzeile .wahl{flex:1 1 auto;min-width:0;width:auto}
.ikon{all:unset;box-sizing:border-box;cursor:pointer;flex:0 0 48px;width:48px;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;border:1.5px solid var(--border);background:var(--bg-card);color:var(--text-secondary);touch-action:manipulation}
.ikon:hover{color:var(--accent-soft)}
textarea{width:100%;min-height:92px;resize:vertical;background:var(--bg-input);border:1.5px solid var(--border);border-radius:12px;color:var(--text-primary);font:400 16px/1.45 var(--font-t);padding:12px;display:block;overflow:hidden}
textarea::placeholder{color:var(--text-muted)}
select{width:100%;min-height:48px;background:var(--bg-input);border:1.5px solid var(--border);border-radius:12px;color:var(--text-primary);font:400 16px/1.3 var(--font-t);padding:10px 12px}
label.feld{display:block;font:600 14px/1.35 var(--font-h);color:var(--text-primary)}
.regler{display:flex;flex-direction:column;gap:2px}
.wahlkopf{display:flex;align-items:center;justify-content:space-between;gap:12px}
.regler .werte{display:flex;justify-content:space-between;font:500 12px/1.2 var(--font-t);color:var(--text-muted)}
.zahl{font:700 1.7rem/1 var(--font-h);color:var(--healthy);min-width:2ch;text-align:right;flex:0 0 auto}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;display:block}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:rgba(148,163,184,.28)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--healthy);border:3px solid var(--bg-deep);margin-top:-12px}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(148,163,184,.28)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--healthy);border:3px solid var(--bg-deep)}
input[type=range][disabled]{opacity:.35}
.hinweis.mit-ikon{display:flex;gap:10px;align-items:flex-start}.hinweis svg{flex:0 0 20px;color:var(--healthy);margin-top:1px}
.hinweis{background:rgba(125,211,192,.08);border:1px solid rgba(125,211,192,.3);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--text-primary);overflow-wrap:anywhere}
.hinweis.warm{background:rgba(249,115,22,.08);border-color:rgba(249,115,22,.4)}
.satzkarte{font:700 clamp(1.1rem,5vw,1.35rem)/1.35 var(--font-h);color:var(--text-primary);overflow-wrap:anywhere}
ul.preis{list-style:none;display:flex;flex-direction:column;gap:6px}
ul.preis li{font-size:14px;color:var(--text-secondary);padding-left:14px;position:relative;overflow-wrap:anywhere}
ul.preis li::before{content:'';position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--healthy-dark)}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;padding:6px 4px;border-radius:10px;border:1.5px solid var(--border);background:transparent;color:var(--text-secondary);font:600 13px/1.2 var(--font-h);text-align:center;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.seg button[aria-pressed="true"]{border-color:var(--healthy);background:rgba(125,211,192,.13);color:var(--healthy)}
.meta{font:500 13px/1.4 var(--font-t);color:var(--text-muted);overflow-wrap:anywhere}
.nowrap{white-space:nowrap}
.satz-grid{display:flex;flex-direction:column;gap:12px}
/* Sammlung: eine Karte pro Satz, Status-Icon getrennt antippbar (keine verschachtelten Buttons) */
.karte.item{flex-direction:row;align-items:stretch;gap:0;padding:0;overflow:hidden}
.item .open{all:unset;box-sizing:border-box;cursor:pointer;flex:1 1 auto;min-width:0;min-height:64px;padding:14px 12px 14px 14px;display:flex;flex-direction:column;justify-content:center;gap:8px;touch-action:manipulation}
.item .open:focus-visible{outline:2px solid var(--accent-soft);outline-offset:-3px;border-radius:14px}
.item .alt{font:600 1.02rem/1.4 var(--font-h);color:var(--text-primary);overflow-wrap:anywhere}
.item .alt.gedaempft{opacity:.55;text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:rgba(148,163,184,.55)}
.item .neu{font:600 1.02rem/1.4 var(--font-h);color:var(--text-primary);border-left:3px solid var(--healthy);padding-left:10px;overflow-wrap:anywhere}
.stat{all:unset;box-sizing:border-box;cursor:pointer;flex:0 0 78px;min-width:44px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;border-left:1px solid var(--border);color:var(--text-secondary);font:600 11px/1.15 var(--font-h);text-align:center;touch-action:manipulation;overflow-wrap:anywhere}
.stat[data-s="1"]{color:var(--accent-soft)}.stat[data-s="2"]{color:var(--healthy)}
.item.blitz{animation:blitz 1s ease-out}
@keyframes blitz{0%{box-shadow:0 0 0 2px var(--accent)}100%{box-shadow:0 0 0 2px transparent}}
.fakten{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.fakten dt{font:700 11px/1.6 var(--font-h);color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase}
.fakten dd{margin:0;font-size:15px;color:var(--text-primary);overflow-wrap:anywhere;min-width:0}
details.mehr{border:1px solid var(--border);border-radius:var(--radius)}
details.mehr summary{cursor:pointer;list-style:none;min-height:48px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;font:600 15px/1.3 var(--font-h);color:var(--text-secondary);touch-action:manipulation}
details.mehr summary::-webkit-details-marker{display:none}
details.mehr summary::after{content:'';width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin:-4px 4px 0 0;transition:transform .2s}
details.mehr[open] summary::after{transform:rotate(-135deg);margin-top:4px}
details.mehr .inhalt{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
@media (orientation:landscape) and (max-height:520px){
  .shell{max-width:760px}
  .satz-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
}
@media (prefers-reduced-motion:reduce){.fade>*{animation:none!important}.btn:active,.chip:active,.wahl:active,.antw button:active,.stat:active,.item .open:active{transform:none}.blitz{animation:none!important}.prog .fuell,.sw .k,.sw .k::after{transition:none}*{scroll-behavior:auto!important}}
</style>

'use strict';
/* ===================== DATEN ===================== */
var CLUSTER = {

/* ===================== EXPORT ===================== */
function exportText(list){
  var L = ['Meine Glaubenssätze (Klarkommen)', '================================', ''];
  list.forEach(function(e, i){
    if (i > 0){ L.push('--------------------------------'); L.push(''); }
    L.push('„' + e.satz + '“');
    L.push('Kategorie: ' + katName(e));
    L.push('Gewichtung: ' + e.gewicht + ' von 10');
    if (e.neuerSatz) L.push('Neuer Satz: „' + e.neuerSatz + '“');
    if (e.preis.length){
      L.push('Was er mich kostet:');
      e.preis.forEach(function(p){ L.push('- ' + p); });
    }
    if (e.preisText) L.push('Wenn er noch 5 Jahre bleibt, verpasse ich: ' + e.preisText);
    L.push('Datum: ' + fmtDatum(e.datum));
    L.push('');
  });
  return L.join('\n');
}
function kopieren(text, ausRueckfall, box){
  function ok(){ box.zeige(ausRueckfall ? 'Teilen geht hier nicht. Der Text liegt in der Zwischenablage.' : 'In die Zwischenablage kopiert.'); }
  function alt(){
    try {
      var t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly',''); t.style.cssText = 'position:absolute;left:-9999px;top:0';
      document.body.appendChild(t); t.select(); var r = document.execCommand('copy'); document.body.removeChild(t);
      if (r) ok(); else box.zeige('Kopieren hat nicht geklappt. Nutze „Als Datei speichern“.');
    } catch(e){ box.zeige('Kopieren hat nicht geklappt. Nutze „Als Datei speichern“.'); }
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, alt); else alt();
  } catch(e){ alt(); }
}
function teilen(text, box){
  if (navigator.share){
    try {
      navigator.share({ title:'Meine Glaubenssätze (Klarkommen)', text:text }).then(function(){ box.zeige('Geteilt.'); }, function(err){
        if (err && err.name === 'AbortError') return;
        kopieren(text, true, box);
      });
    } catch(e){ kopieren(text, true, box); }
  } else kopieren(text, true, box);
}
function alsDatei(text, box){
  try {
    var blob = new Blob([text], { type:'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = 'meine-glaubenssaetze.txt';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    box.zeige('Datei „meine-glaubenssaetze.txt“ wird gespeichert.');
  } catch(e){ box.zeige('Speichern als Datei hat nicht geklappt. Nutze „Kopieren“.'); }
}
function exportLeiste(getList){
  var box = statusBox();
  var zeile = h('div', { class:'zeile3' }, [
    btn('Teilen', 'kompakt', function(){ teilen(exportText(getList()), box); }),
    btn('Kopieren', 'kompakt', function(){ kopieren(exportText(getList()), false, box); }),
    btn('Als Datei speichern', 'kompakt', function(){ alsDatei(exportText(getList()), box); })
  ]);
  return h('div', { style:'display:flex;flex-direction:column;gap:8px' }, [ zeile, box ]);
}

/* ===================== SAMMLUNG ===================== */
function statusSeg(e, nachher){
  return h('div', { class:'seg', role:'group', 'aria-label':'Status' }, STATI.map(function(s){
    return h('button', { type:'button', 'aria-pressed': e.status === s ? 'true':'false', onclick:function(){
      aendere(e.id, function(x){ x.status = s; }); nachher();
    } }, s);
  }));
}
/* Status-Icon: Tippen schaltet Aufgespürt, In Arbeit, Verwandelt, Aufgespürt durch; öffnet die Karte nicht */
function statusKnopf(e){
  var ix = STATI.indexOf(e.status);
  return h('button', { type:'button', class:'stat', 'data-s':String(ix), 'data-stat':e.id,
    'aria-label':'Status: ' + e.status + '. Tippen zum Weiterschalten.',
    onclick:function(ev){
      ev.stopPropagation();
      var neu = naechsterStatus(e.status);

      var el = main.querySelector('[data-stat="' + e.id + '"]');
      if (el){
        try { el.focus({ preventScroll:true }); } catch(x){}
        var r = el.getBoundingClientRect();
        if (r.top < 56 || r.bottom > window.innerHeight){ try { el.scrollIntoView({ block:'center' }); } catch(x2){} }
        if (el.parentNode) el.parentNode.classList.add('blitz');
      }
      ansage('Status: ' + neu + '.');
      toast('Status: ' + neu + '.');
    } },
    [ statusIcon(e.status), h('span', { text:e.status }) ]);
}
function itemKarte(e){

function vBearbeiten(){
  var neu = !cur.id, alt = neu ? null : eintragById(cur.id);
  if (!neu && !alt){ zurueckSchritt(); return; }
  if (!E || E.id !== (cur.id || null) || E.frisch){
    E = { id: cur.id || null, frisch:false,
      satz: alt ? alt.satz : '', cluster: alt ? alt.cluster : null, wahrAn: alt ? alt.wahr !== null : false, wahr: alt && alt.wahr !== null ? alt.wahr : 5,
      kosten: alt ? alt.preis.slice() : [], preisText: alt ? alt.preisText : '', gewicht: alt ? alt.gewicht : 5, neuerSatz: alt ? alt.neuerSatz : '' };
  }
  var weiter;
  var ta = mkTa({ id:'e-satz', 'aria-label':'Satz', maxlength:'300', placeholder:'Ich …' }); ta.value = E.satz;
  ta.addEventListener('input', function(){ E.satz = ta.value; setzeAktiv(weiter, !!ta.value.trim()); });
  var sel = h('select', { id:'e-kat', 'aria-label':'Kategorie' });
  sel.appendChild(h('option', { value:'', text:'Weiß nicht' }));
  CLUSTER_ORDER.forEach(function(id){ sel.appendChild(h('option', { value:id, text:THEMA[id] })); });
  sel.value = E.cluster || '';
  sel.addEventListener('change', function(){ E.cluster = sel.value || null; });
  var zahl = h('div', { class:'zahl', text:String(E.wahr) });
  var rng = h('input', { type:'range', min:'0', max:'10', step:'1', value:String(E.wahr), id:'e-wahr', 'aria-label':'Wahr-Wert, 0 bis 10' });
  rng.addEventListener('input', function(){ E.wahr = parseInt(rng.value,10); zahl.textContent = String(E.wahr); });
  function wahrSync(){ rng.disabled = !E.wahrAn; zahl.style.opacity = E.wahrAn ? '1' : '.35'; sw.setAttribute('aria-checked', E.wahrAn ? 'true':'false'); }
  var sw = h('button', { type:'button', class:'sw', role:'switch', 'aria-checked': E.wahrAn ? 'true':'false', onclick:function(){ E.wahrAn = !E.wahrAn; wahrSync(); } }, h('span', { class:'k' }), h('span', { text:'Wahr-Wert angeben' }));
  var kl = h('div', { style:'display:flex;flex-direction:column;gap:10px' });
  function zeichneK(fokusLetzte){
    kl.textContent = '';
    E.kosten.forEach(function(t, i){
      var k = mkTa({ 'aria-label':'Kostenpunkt ' + (i+1), maxlength:'300' }); k.value = t;
      k.addEventListener('input', function(){ E.kosten[i] = k.value; });
      kl.appendChild(h('div', { class:'karte' }, [ k, btn('Punkt entfernen', 'leise kompakt', function(){ E.kosten.splice(i,1); zeichneK(); }) ]));
    });
    var tas = kl.querySelectorAll('textarea'); for (var q=0;q<tas.length;q++) autogrow(tas[q]);
    if (fokusLetzte && tas.length) tas[tas.length-1].focus();
  }
  var pt = mkTa({ id:'e-5', 'aria-label':'Was verpasst du in fünf Jahren', placeholder:'Freiwillig …', maxlength:'400' }); pt.value = E.preisText;
  pt.addEventListener('input', function(){ E.preisText = pt.value; });
  var nsa = mkTa({ id:'e-neu', 'aria-label':'Neuer Satz', placeholder:'Ich …', maxlength:'300' }); nsa.value = E.neuerSatz;
  nsa.addEventListener('input', function(){ E.neuerSatz = nsa.value; });
  weiter = btn('Speichern', 'primaer', function(){
    var t = E.satz.trim(); if (!t) return;
    var kosten = E.kosten.map(function(x){ return x.trim(); }).filter(Boolean);
    var e2;
    if (neu){
      e2 = norm({ id:neueId(), datum:heute(), geaendert:heute(), quelle:'eigen', status:STATI[0] });
    } else { e2 = alt; e2.geaendert = heute(); }
    e2.satz = t; e2.cluster = E.cluster; e2.wahr = E.wahrAn ? E.wahr : null; if (E.wahrAn) e2.treffer = 0; e2.preis = kosten; e2.preisText = E.preisText.trim(); e2.gewicht = E.gewicht; e2.neuerSatz = E.neuerSatz.trim();
    ersetzeEintrag(e2); E = null; zurueckSchritt();
  });
  setzeAktiv(weiter, !!E.satz.trim());
  render('bearbeiten', [
    h('h2', { text: neu ? 'Eigenen Satz anlegen' : 'Satz bearbeiten' }),
    h('div', { class:'karte teal' }, [ h('label', { class:'feld', for:'e-satz', text:'Ich glaube:' }), ta ]),

    h('div', { class:'foot' }, [ weiter, btn('Abbrechen', 'leise', function(){ E = null; zurueckSchritt(); }) ])
  ]);
  zeichneK(false); wahrSync();
}
