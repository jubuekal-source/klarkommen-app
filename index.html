<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1923">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Klarkommen">
<meta name="description" content="Klarkommen – Mentale Stärke. Klare Richtung.">
<title>Klarkommen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="brand/icon-192.png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<link rel="preload" href="fonts/space-grotesk-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/dm-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* ================================================================
   Klarkommen – App-Shell (spec/00, spec/01). Reihenfolge nach Skill §2.8:
   Style → HTML-Gerüst → Daten/Helper → Render → Events → Init
   ================================================================ */

/* ===== Tokens (Skill klarkommen-design §7 → --brand-*) – spec/01 §C.8 ===== */
:root{
  color-scheme:dark;
  --brand-bg:#0f1923; --brand-bg-deep:#0a121a; --brand-card:#162230; --brand-card-2:#1c2e40; --brand-input:#1c2e40;
  --brand-accent:#f97316; --brand-accent-soft:#fb923c; --brand-accent-glow:rgba(249,115,22,.25);
  --brand-ok:#7DD3C0; --brand-ok-dark:#5BB8A5; --brand-bad:#B41928; --brand-bad-glow:rgba(180,25,40,.45);
  --brand-text:#f1f5f9; --brand-text-2:#94a3b8; --brand-muted:#64748b;
  --brand-line:rgba(148,163,184,.12); --brand-line-2:rgba(148,163,184,.22);
  --brand-radius:16px; --brand-radius-lg:22px;
  --brand-font-head:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --brand-font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --read:720px; --wide:1120px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--brand-bg)}
html,body{margin:0;padding:0;overflow-x:clip;max-width:100%}
body{font-family:var(--brand-font-body);font-size:17px;line-height:1.65;color:var(--brand-text);min-height:100dvh;
  background:var(--brand-bg) radial-gradient(ellipse 120% 60% at 15% 0%,rgba(249,115,22,.06),transparent 55%) no-repeat;
  -webkit-font-smoothing:antialiased;padding-bottom:var(--sab)}
h1,h2,h3,h4{font-family:var(--brand-font-head);font-weight:700;letter-spacing:-.02em;line-height:1.18;margin:0 0 .45em;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
p{margin:0 0 1em}
a{color:var(--brand-accent-soft);text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
input,textarea{font:inherit;font-size:16px;color:var(--brand-text)}
img{max-width:100%;display:block}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.f{fill:currentColor;stroke:none}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--brand-accent);outline-offset:3px;border-radius:8px}
.wrap{max-width:var(--read);margin:0 auto;padding:0 16px}
@supports (padding:max(0px)){.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}}
.wrap.wide{max-width:var(--wide)}
#app{min-height:60vh}
.view{animation:enter .38s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:12px 22px;border-radius:14px;font-weight:700;font-size:1rem;
  background:var(--brand-accent);color:#1a0d03;box-shadow:0 8px 24px -8px var(--brand-accent-glow);transition:transform .15s,background .15s;text-decoration:none;text-align:center;line-height:1.25}
.btn:hover{background:var(--brand-accent-soft)}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--brand-card-2);color:var(--brand-text);box-shadow:none;border:1px solid var(--brand-line-2)}
.btn.sec:hover{background:#223650}
.btn.ghost{background:transparent;color:var(--brand-text-2);box-shadow:none;border:1px solid var(--brand-line-2)}
.btn.bad{background:transparent;color:#f3a3ab;border:1px solid rgba(180,25,40,.55);box-shadow:none}
.btn.block{display:flex;width:100%}
.btn svg.i{width:20px;height:20px}
.btns{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:560px){.btns.two{grid-template-columns:1fr 1fr}}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 8px 24px -8px var(--brand-accent-glow),0 0 0 0 rgba(249,115,22,.35)}50%{box-shadow:0 8px 24px -8px var(--brand-accent-glow),0 0 0 10px rgba(249,115,22,0)}}
.iconbtn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--brand-text);flex:none}
.glass{background:rgba(10,18,26,.42);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

/* ===== Startseite / Hero – spec/01 §C.2 ===== */
.hero{position:relative;min-height:calc(min(72svh,600px) + var(--sat));display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;z-index:-2;transform:scale(1.02)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(10,18,26,.70) 0%,rgba(10,18,26,.25) 34%,rgba(10,18,26,0) 52%,rgba(15,25,35,.35) 76%,var(--brand-bg) 100%)}
.hero .top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(12px + var(--sat)) 16px 0;max-width:var(--wide);width:100%;margin:0 auto}
.hero .ttl{padding:18px 16px 0;max-width:var(--wide);width:100%;margin:0 auto}
.hero h1{font-size:clamp(2.9rem,15.5vw,6.2rem);line-height:.95;letter-spacing:-.045em;margin:0;text-shadow:0 4px 30px rgba(0,0,0,.35)}
.hero .sub{font-family:var(--brand-font-head);font-weight:500;font-size:clamp(1.06rem,4.6vw,1.5rem);line-height:1.3;margin-top:12px;color:#e7edf4;max-width:22em;text-shadow:0 2px 16px rgba(0,0,0,.55)}
.hero .sub::before{content:"";display:block;width:44px;height:3px;border-radius:2px;background:var(--brand-accent);margin-bottom:12px}
.hero .bottom{margin-top:auto;padding:0 16px 20px;max-width:var(--wide);width:100%;margin-left:auto;margin-right:auto}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 14px 6px 10px;border-radius:999px;font-size:.84rem;font-weight:500;color:var(--brand-text)}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--brand-text-2);box-shadow:0 0 0 3px rgba(148,163,184,.18)}
.pill.ok .dot{background:var(--brand-ok);box-shadow:0 0 0 3px rgba(125,211,192,.2)}
.pill.todo .dot{background:var(--brand-accent);box-shadow:0 0 0 3px rgba(249,115,22,.22)}
.pill.off .dot{background:#e2a03f}
.lead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 6px}
.lead h2{font-size:1.5rem;margin:0}
.lead .meta{color:var(--brand-text-2);font-size:.88rem;white-space:nowrap}
.introtxt{color:var(--brand-text-2);margin:0 0 6px;font-size:.98rem}

/* Reise (Kapitel-Galerie) */
.reise{display:grid;grid-template-columns:1fr;gap:14px;margin-top:6px}
.phase{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:22px 0 2px;color:var(--brand-text-2);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.phase::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--brand-line-2),transparent)}
.phase b{color:var(--brand-accent-soft);font-weight:700}
.tile .ph{display:none;color:#d5dde6;font-weight:500;letter-spacing:.08em}
@media(min-width:700px){.reise{grid-template-columns:1fr 1fr;gap:18px}.reise .phase{display:none}.tile .ph{display:inline}.tile.wide{grid-column:1/-1;aspect-ratio:auto;height:clamp(230px,30vw,320px)}}
@media(min-width:1100px){.reise{grid-template-columns:1fr 1fr 1fr}}
.tile{position:relative;display:block;width:100%;text-align:left;border-radius:var(--brand-radius-lg);overflow:hidden;background:var(--brand-card);aspect-ratio:16/10;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 18px 40px -22px rgba(0,0,0,.8);isolation:isolate;transition:transform .25s var(--ease)}
.tile:active{transform:scale(.985)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .6s var(--ease),filter .3s}
@media(hover:hover){.tile:hover img{transform:scale(1.035)}}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,18,26,0) 28%,rgba(10,18,26,.66) 58%,rgba(10,18,26,.96) 100%)}
.tile .tx{text-shadow:0 1px 10px rgba(0,0,0,.55)}
.tile .tx{position:absolute;left:0;right:0;bottom:0;padding:16px 16px 15px;display:flex;align-items:flex-end;gap:12px}
.tile .tx>div{min-width:0;flex:1}
.tile .eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-accent-soft);margin-bottom:3px}
.tile h3{font-size:1.32rem;margin:0;line-height:1.12;color:#fff}
.tile .u{color:#d5dde6;font-size:.92rem;line-height:1.35;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ring{width:46px;height:46px;flex:none;position:relative;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#fff;font-family:var(--brand-font-head)}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .tr{stroke:rgba(255,255,255,.18)} .ring .pr{stroke:var(--brand-ok);transition:stroke-dashoffset .6s var(--ease)}
.ring.done{color:#0f1923}
.ring.done::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--brand-ok)}
.ring.done span{position:relative}
.lockb{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.lockb svg.i{width:19px;height:19px;stroke-width:2}
.tile .tag{display:inline-block;margin-top:7px;font-size:.72rem;font-weight:700;letter-spacing:.06em;color:#fff;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18)}
/* Sperr-Varianten – spec/01 §C.3 (a: nur Badge · b: unten abgedunkelt · c: 25 % entsättigt) */
.sv-b .tile.locked::before{background:linear-gradient(180deg,rgba(10,18,26,.10) 0%,rgba(10,18,26,.25) 30%,rgba(10,18,26,.72) 62%,rgba(10,18,26,.97) 100%)}
.sv-b .tile.locked img{filter:brightness(.86)}
.sv-c .tile.locked img{filter:saturate(.75)}
#einfuehrung[hidden]{display:none}

/* ===== App-Leiste (Kapitel/Slide/Einstellungen) ===== */
.bar{position:sticky;top:0;z-index:40;padding-top:var(--sat);background:rgba(15,25,35,.78);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--brand-line)}
.bar .in{max-width:var(--wide);margin:0 auto;display:flex;align-items:center;gap:6px;padding:6px 8px;min-height:56px}
.bar .t{flex:1;min-width:0;font-family:var(--brand-font-head);font-weight:500;font-size:.95rem;color:var(--brand-text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.bar .t b{color:var(--brand-text);font-weight:700}
.segs{display:flex;gap:5px;max-width:var(--read);margin:0 auto;padding:0 16px 10px}
.segs a{flex:1;height:4px;border-radius:3px;background:rgba(148,163,184,.2);position:relative}
.segs a::after{content:"";position:absolute;inset:-10px 0}
.segs a.r{background:var(--brand-ok-dark)}
.segs a.cur{background:var(--brand-accent)}

/* ===== Kapitelseite – spec/01 §C.4 ===== */
.khead{position:relative;isolation:isolate;overflow:hidden;min-height:min(92vw,520px);display:flex;align-items:flex-end}
.khead img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.khead::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(15,25,35,.15) 0%,rgba(15,25,35,0) 28%,rgba(15,25,35,.62) 56%,rgba(15,25,35,.93) 80%,var(--brand-bg) 100%)}
.khead .eyebrow,.khead h1,.khead .u{text-shadow:0 2px 14px rgba(0,0,0,.6)}
.khead .wrap{width:100%;padding-top:80px;padding-bottom:6px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--brand-accent-soft);margin-bottom:8px}
.khead h1{font-size:clamp(2rem,9vw,3.4rem);margin:0;letter-spacing:-.035em}
.khead .u{font-family:var(--brand-font-head);font-weight:500;font-size:clamp(1.05rem,4.4vw,1.35rem);color:#dbe3ec;margin-top:6px;line-height:1.3}
.kmeta{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--brand-text-2);font-size:.9rem;margin:16px 0 22px}
.kmeta span{display:inline-flex;gap:7px;align-items:center}
.kmeta svg.i{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(249,115,22,.12);color:var(--brand-accent-soft);border:1px solid rgba(249,115,22,.28)}
.etappen{list-style:none;margin:26px 0 8px;padding:0;position:relative}
.etappen::before{content:"";position:absolute;left:23px;top:30px;bottom:30px;width:2px;background:linear-gradient(var(--brand-line-2),var(--brand-line-2))}
.etappe{position:relative;margin:0 0 10px}
.etappe a{display:flex;align-items:center;gap:14px;padding:12px 12px 12px 0;text-decoration:none;color:inherit;border-radius:16px}
.etappe a:active{background:rgba(255,255,255,.03)}
.etappe .ic{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--brand-card);border:1px solid var(--brand-line-2);color:var(--brand-text-2);position:relative;z-index:1}
.etappe.r .ic{background:#163834;border-color:rgba(125,211,192,.45);color:var(--brand-ok)}
.etappe.next .ic{background:var(--brand-accent);border-color:var(--brand-accent);color:#1a0d03;box-shadow:0 0 0 6px rgba(249,115,22,.14)}
.etappe .txt{flex:1;min-width:0}
.etappe .rb{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--brand-text-2)}
.etappe .tt{font-family:var(--brand-font-head);font-weight:700;font-size:1.06rem;line-height:1.28;margin-top:2px}
.etappe .ok{color:var(--brand-ok);display:flex}
.etappe .chev{color:var(--brand-muted)}

/* ===== Slide – spec/01 §C.5 ===== */
.shead{position:relative;isolation:isolate;overflow:hidden;aspect-ratio:16/8;max-height:52vh;width:100%}
@media(min-width:700px){.shead{aspect-ratio:16/6.2}}
.shead img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.shead::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(15,25,35,0) 45%,var(--brand-bg) 100%)}
.slide{padding-top:4px;padding-bottom:10px}
.rubrik{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-accent-soft);margin:-4px 0 10px}
.rubrik svg.i{width:18px;height:18px}
.slide h1{font-size:clamp(1.7rem,7.4vw,2.5rem);letter-spacing:-.03em;margin-bottom:18px}
.bl h2{font-size:1.32rem;margin:30px 0 10px}
.bl>p{margin:0 0 1.05em}
.bl ul,.bl ol{margin:0 0 1.2em;padding-left:1.35em}
.bl li{margin:.35em 0;padding-left:.2em}
.bl li::marker{color:var(--brand-accent-soft);font-weight:700}
.bl blockquote{margin:22px 0;padding:2px 0 2px 18px;border-left:3px solid var(--brand-accent);font-family:var(--brand-font-head);font-size:1.22rem;font-weight:500;line-height:1.4;color:#fff}
.bl blockquote cite{display:block;margin-top:8px;font-family:var(--brand-font-body);font-style:normal;font-size:.88rem;font-weight:400;color:var(--brand-text-2)}
.call{display:flex;gap:12px;padding:14px 16px;border-radius:14px;margin:18px 0;background:rgba(125,211,192,.07);border:1px solid rgba(125,211,192,.22)}
.call svg.i{color:var(--brand-ok);margin-top:2px}
.call.wichtig{background:rgba(249,115,22,.08);border-color:rgba(249,115,22,.3)} .call.wichtig svg.i{color:var(--brand-accent-soft)}
.call.info{background:rgba(148,163,184,.07);border-color:var(--brand-line-2)} .call.info svg.i{color:var(--brand-text-2)}
.call p{margin:0}
figure{margin:22px 0}
figure img{width:100%;height:auto;border-radius:14px;background:var(--brand-card)}
figcaption{color:var(--brand-text-2);font-size:.88rem;margin-top:8px}
.check{list-style:none;padding:0!important;margin:12px 0 18px}
.check li{padding:0!important;margin:8px 0}
.check label{display:flex;gap:14px;align-items:flex-start;padding:14px 14px;border-radius:14px;background:var(--brand-card);border:1px solid var(--brand-line);cursor:pointer;min-height:52px}
.check input{position:absolute;opacity:0;pointer-events:none}
.check .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--brand-line-2);flex:none;display:flex;align-items:center;justify-content:center;color:transparent;transition:.2s;margin-top:1px}
.check input:checked+.bx{background:var(--brand-ok);border-color:var(--brand-ok);color:#0f1923}
.check input:focus-visible+.bx{outline:2px solid var(--brand-accent);outline-offset:2px}
.check input:checked~span{color:var(--brand-text-2)}
details.acc{margin:18px 0;border-radius:16px;background:var(--brand-card);border:1px solid var(--brand-line)}
details.acc>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px;min-height:56px;cursor:pointer;font-family:var(--brand-font-head);font-weight:700;font-size:1.04rem}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .chv{margin-left:auto;transition:transform .25s;color:var(--brand-text-2)}
details.acc[open]>summary .chv{transform:rotate(180deg)}
details.acc>summary>svg.i:first-child{color:var(--brand-accent-soft)}
details.acc .acb{padding:0 16px 8px}
details.acc.lese{background:linear-gradient(180deg,rgba(249,115,22,.07),rgba(249,115,22,0) 70%),var(--brand-card);border-color:rgba(249,115,22,.25)}
.lnk .lnk-on{color:var(--brand-text-2);display:flex;align-items:center;gap:6px;margin:10px 0 0;font-size:.84rem}.lnk .lnk-on svg.i{width:16px;height:16px}
.quelle{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--brand-line);font-size:.94rem;color:#d3dbe4}
.quelle:last-child{border-bottom:none}
.quelle svg.i{width:18px;height:18px;color:var(--brand-text-2);margin-top:3px}
.quelle a{overflow-wrap:anywhere}

/* Audio-Karte */
.audio{margin:22px 0;padding:16px;border-radius:20px;background:linear-gradient(135deg,#1d3046 0%,var(--brand-card) 60%);border:1px solid var(--brand-line-2);box-shadow:0 20px 40px -28px rgba(0,0,0,.9)}
.audio .row{display:flex;align-items:center;gap:14px}
.audio .play{width:64px;height:64px;border-radius:50%;background:var(--brand-accent);color:#1a0d03;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 10px 26px -8px var(--brand-accent-glow)}
.audio .play svg.i{width:28px;height:28px}
.audio .play .pa{display:none}
.audio.on .play .pl{display:none} .audio.on .play .pa{display:block}
.audio .meta{min-width:0;flex:1}
.audio .art{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--brand-accent-soft);display:flex;align-items:center;gap:6px}
.audio .art svg.i{width:16px;height:16px}
.audio .at{font-family:var(--brand-font-head);font-weight:700;font-size:1.04rem;line-height:1.3;margin-top:2px}
.audio .sub{color:var(--brand-text-2);font-size:.84rem;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 12px}
.audio .off{color:var(--brand-ok);display:inline-flex;align-items:center;gap:4px}
.audio .off svg.i{width:15px;height:15px;stroke-width:2.2}
.audio .ctl{display:flex;align-items:center;gap:6px;margin-top:14px}
.audio .skip{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--brand-text-2);position:relative;flex:none}
.audio .skip span{position:absolute;font-size:.56rem;font-weight:700;top:16px;left:0;right:0;text-align:center;color:var(--brand-text)}
.audio .skip svg.i{width:30px;height:30px;stroke-width:1.5}
.audio .tl{flex:1;min-width:0}
.audio .times{display:flex;justify-content:space-between;font-size:.76rem;color:var(--brand-text-2);font-variant-numeric:tabular-nums;margin-top:2px}
input[type=range].seek{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;--p:0%}
input[type=range].seek::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--brand-accent) var(--p),rgba(148,163,184,.25) var(--p))}
input[type=range].seek::-moz-range-track{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--brand-accent) var(--p),rgba(148,163,184,.25) var(--p))}
input[type=range].seek::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;margin-top:-6.5px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range].seek::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:none}
.audio.prod{display:flex;gap:14px;align-items:center;background:var(--brand-card)}
.audio.prod .play{background:var(--brand-card-2);color:var(--brand-text-2);box-shadow:none;border:1px dashed var(--brand-line-2)}
/* Experiment-Karte */
.exp{margin:22px 0;border-radius:20px;overflow:hidden;position:relative;isolation:isolate;padding:20px 18px 18px;
  background:radial-gradient(120% 120% at 100% 0%,rgba(249,115,22,.22),transparent 55%),radial-gradient(90% 90% at 0% 100%,rgba(125,211,192,.12),transparent 60%),var(--brand-card);border:1px solid rgba(249,115,22,.28)}
.exp .art{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--brand-accent-soft);display:flex;align-items:center;gap:7px}
.exp h3{font-size:1.3rem;margin:8px 0 6px}
.exp p{color:#d3dbe4;margin:0 0 16px}
/* Weiter-Karte */
.weiter{display:flex;align-items:center;gap:14px;margin:34px 0 8px;padding:18px 18px;border-radius:20px;text-decoration:none;color:var(--brand-text);background:var(--brand-card);border:1px solid var(--brand-line-2);transition:transform .15s}
.weiter:active{transform:scale(.99)}
.weiter .k{flex:1;min-width:0}
.weiter .l{font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--brand-accent-soft)}
.weiter .n{font-family:var(--brand-font-head);font-weight:700;font-size:1.12rem;line-height:1.3;margin-top:3px}
.weiter .go{width:48px;height:48px;border-radius:50%;background:var(--brand-accent);color:#1a0d03;display:flex;align-items:center;justify-content:center;flex:none}
.weiter.end{background:linear-gradient(135deg,rgba(125,211,192,.14),rgba(125,211,192,0) 70%),var(--brand-card);border-color:rgba(125,211,192,.32)}
.weiter.end .l{color:var(--brand-ok)}
.weiter.end .go{background:var(--brand-ok)}
.zurueck{display:flex;align-items:center;gap:8px;color:var(--brand-text-2);text-decoration:none;font-size:.92rem;padding:12px 0;min-height:44px}
.zurueck svg.i{width:18px;height:18px}
.beispiel{display:flex;gap:10px;align-items:center;font-size:.84rem;color:#f6c9a4;background:rgba(249,115,22,.08);border:1px dashed rgba(249,115,22,.4);border-radius:12px;padding:8px 12px;margin:14px 0 0}

/* ===== Experiment-Vollbild – spec/01 §C.1 ===== */
.xview{position:fixed;inset:0;z-index:60;background:var(--brand-bg);display:flex;flex-direction:column}
.xbar{flex:none;padding-top:var(--sat);background:rgba(15,25,35,.94);border-bottom:1px solid var(--brand-line)}
.xbar .in{display:flex;align-items:center;gap:10px;padding:6px 10px;min-height:56px;max-width:var(--wide);margin:0 auto}
.xbar .back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px 0 10px;border-radius:999px;background:var(--brand-card-2);border:1px solid var(--brand-line-2);font-weight:700}
.xbar .t{flex:1;min-width:0;font-family:var(--brand-font-head);font-weight:500;color:var(--brand-text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xview iframe{flex:1;width:100%;border:0;background:var(--brand-bg)}
body.xmode{overflow:hidden}
body.xmode .fab,body.xmode footer.foot{display:none}

/* ===== Einstellungen – spec/01 §C.6 ===== */
.pagehead{padding:26px 0 6px}
.pagehead h1{font-size:2rem;margin:0}
.pagehead p{color:var(--brand-text-2);margin:6px 0 0}
.card{background:var(--brand-card);border:1px solid var(--brand-line);border-radius:20px;padding:18px 16px;margin:16px 0}
.card h2{font-size:1.18rem;display:flex;align-items:center;gap:10px;margin:0 0 12px}
.card h2 svg.i{color:var(--brand-accent-soft)}
.card .hint{color:var(--brand-text-2);font-size:.9rem;margin:0 0 12px}
.fld{display:block;margin:0 0 12px}
.fld span{display:block;font-size:.84rem;color:var(--brand-text-2);margin-bottom:6px;font-weight:500}
.fld input{width:100%;min-height:50px;padding:12px 14px;border-radius:12px;border:1px solid var(--brand-line-2);background:var(--brand-input);outline:none}
.fld input:focus{border-color:var(--brand-accent);box-shadow:0 0 0 3px var(--brand-accent-glow)}
.prev{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/8;margin:0 0 12px;background:var(--brand-card-2)}
.prev img{width:100%;height:100%;object-fit:cover}
.prev .lbl{position:absolute;left:10px;bottom:10px;font-size:.78rem;padding:4px 10px;border-radius:999px}
.bar2{height:10px;border-radius:6px;background:rgba(148,163,184,.18);overflow:hidden;margin:10px 0 8px}
.bar2 i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand-ok-dark),var(--brand-ok));border-radius:6px;transition:width .3s}
.ostat{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;color:var(--brand-text-2);flex-wrap:wrap}
.ostat b{color:var(--brand-text)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.86rem;color:var(--brand-text-2);margin:10px 0 14px}
.kv b{color:var(--brand-text);font-weight:500}
.sep{height:1px;background:var(--brand-line);margin:16px 0}
.linkrow{display:flex;align-items:center;gap:12px;padding:6px 0;text-decoration:none;color:var(--brand-text);min-height:52px}
.linkrow .k{flex:1}
.linkrow small{display:block;color:var(--brand-text-2);font-size:.86rem}

/* ===== Experiment-Serie & Deep-Links – spec/03 ===== */
.exp .xdone{margin-left:auto;display:inline-flex;align-items:center;gap:4px;color:var(--brand-ok);letter-spacing:.06em}
.exp .xdone svg.i{width:15px;height:15px;stroke-width:2.2}
.exp span.btn[aria-disabled]{opacity:.7;cursor:default}
.exp.serie{padding-bottom:8px}
.xsteps{list-style:none;margin:14px 0 0!important;padding:0!important;position:relative}
.xsteps::before{content:"";position:absolute;left:17px;top:22px;bottom:34px;width:2px;background:var(--brand-line-2)}
.xstep{display:flex;gap:14px;margin:0 0 14px!important;padding:0!important;position:relative}
.xstep .xn{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--brand-font-head);font-weight:700;background:var(--brand-card-2);border:1px solid var(--brand-line-2);color:var(--brand-text-2);position:relative;z-index:1}
.xstep.cur .xn{background:var(--brand-accent);border-color:var(--brand-accent);color:#1a0d03;box-shadow:0 0 0 5px rgba(249,115,22,.14)}
.xstep.done .xn{background:#163834;border-color:rgba(125,211,192,.45);color:var(--brand-ok)}
.xstep .xn svg.i{width:18px;height:18px;stroke-width:2.2}
.xstep .xb{flex:1;min-width:0;padding-top:4px}
.xstep h3{font-size:1.1rem;margin:0 0 4px}
.xstep p{margin:0 0 10px!important;font-size:.95rem}
.xstep .btn{min-height:46px;padding:10px 18px}
.xstep .soon{display:inline-flex;align-items:center;gap:6px;color:var(--brand-text-2);font-size:.9rem}
.xstep .soon svg.i{width:17px;height:17px}
.xview.eigenbar .xbar{display:none}

/* ===== Toolbox Kap. 7 – spec/02 §2–4 ===== */
.tb .tbintro{margin-top:4px}
.tbsec{margin:28px 0 6px}
.tbh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.tbh h2{font-size:1.32rem;margin:0;display:flex;align-items:center;gap:9px}
.tbh h2 svg.i{color:var(--brand-accent-soft)}
.tbh span{color:var(--brand-text-2);font-size:.88rem}
.tbh2{margin-top:30px}
.ti{width:44px;height:44px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(125,211,192,.1);border:1px solid rgba(125,211,192,.25);color:var(--brand-ok)}
.ti svg.i{width:22px;height:22px}
/* Schnell-Hilfe: gleich breite Kacheln */
.schnell{display:grid;grid-template-columns:1fr;gap:8px}
.schnell a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;text-decoration:none;color:var(--brand-text);min-height:62px;
  background:linear-gradient(100deg,rgba(249,115,22,.16),rgba(249,115,22,0) 70%),var(--brand-card);border:1px solid rgba(249,115,22,.3)}
.schnell a .ti{background:rgba(249,115,22,.14);border-color:rgba(249,115,22,.32);color:var(--brand-accent-soft);width:40px;height:40px;border-radius:12px}
.schnell b{flex:1;min-width:0;font-family:var(--brand-font-head);font-size:1rem;line-height:1.22}
.schnell small{color:var(--brand-text-2);font-size:.82rem;white-space:nowrap}
.schnell .go{color:var(--brand-accent-soft);display:flex}
.schnell .go svg.i{width:18px;height:18px}
@media(min-width:560px){.schnell{grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}.schnell a{flex-direction:column;align-items:flex-start;min-height:128px;padding:14px}.schnell small{margin-top:auto;white-space:normal}.schnell .go{display:none}}
/* Use-Case-Kacheln */
.ucgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:820px){.ucgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.uc{display:flex;flex-direction:column;gap:6px;padding:16px 14px 14px;border-radius:18px;background:var(--brand-card);border:1px solid var(--brand-line-2);text-decoration:none;color:var(--brand-text);min-height:150px;transition:transform .15s}
.uc:active{transform:scale(.98)}
.uc .ui{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(125,211,192,.1);color:var(--brand-ok);margin-bottom:4px}
.uc b{font-family:var(--brand-font-head);font-size:1.02rem;line-height:1.25;overflow-wrap:break-word;hyphens:auto}
.uc small{color:var(--brand-text-2);font-size:.84rem;line-height:1.35}
.uc .un{margin-top:auto;font-size:.76rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-accent-soft);padding-top:6px}
/* Neu in diesem Kapitel: wischbarer Streifen */
.neu{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.neu::-webkit-scrollbar{display:none}
.neu a{flex:0 0 min(72%,250px);scroll-snap-align:start;display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:18px;text-decoration:none;color:var(--brand-text);position:relative;
  background:radial-gradient(120% 100% at 100% 0%,rgba(125,211,192,.16),transparent 60%),var(--brand-card);border:1px solid rgba(125,211,192,.28);min-height:150px}
.neu b{font-family:var(--brand-font-head);font-size:1.08rem;line-height:1.25;margin-top:6px}
.neu .kz{color:#d3dbe4;font-size:.9rem;line-height:1.3}
.neu small{color:var(--brand-text-2);font-size:.82rem;margin-top:auto}
.neu .tok,.trow .tok{position:absolute;top:14px;right:14px;color:var(--brand-ok);display:flex}
/* Alle-Tools-Link */
.weiter.alle{margin:22px 0 8px}
.weiter.alle .ic2{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--brand-card-2);color:var(--brand-accent-soft);flex:none}
.weiter.alle small{display:block;color:var(--brand-text-2);font-size:.84rem;margin-top:2px}
/* Tool-Liste */
.tlist{list-style:none;margin:8px 0 14px;padding:0}
.tlist li{margin:0 0 10px}
.trow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--brand-card);border:1px solid var(--brand-line);text-decoration:none;color:var(--brand-text);position:relative;min-height:64px}
.trow:active{background:#1a2a3b}
.trow .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.trow b{font-family:var(--brand-font-head);font-size:1.04rem;line-height:1.25}
.trow .kz{color:#cdd6df;font-size:.9rem;line-height:1.3}
.trow small{display:flex;flex-wrap:wrap;align-items:center;gap:2px 7px;color:var(--brand-text-2);font-size:.8rem;margin-top:2px}
.trow small i{font-style:normal;color:var(--brand-muted)}
.trow small svg.i{width:14px;height:14px}
.trow .chev{color:var(--brand-muted);display:flex}
.trow .tok{position:static}
.trow.ok .ti{background:#163834;border-color:rgba(125,211,192,.45)}
.trow.locked{background:transparent;border-style:dashed;border-color:var(--brand-line-2);min-height:56px;padding:10px 14px}
.trow.locked .ti{background:var(--brand-card-2);border-color:var(--brand-line-2);color:var(--brand-text-2);width:36px;height:36px;border-radius:50%}
.trow.locked .ti svg.i{width:17px;height:17px}
.trow.locked b{font-size:.98rem;color:#cdd6df}
/* Filter-Chips: gleich breites Raster (Skill §10.4) */
.flabel{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-text-2);margin:18px 0 8px}
.flabel svg.i{width:16px;height:16px}
.flabel.gs{margin-top:26px}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chips .fchip:last-child:nth-child(odd){grid-column:1/-1}
@media(min-width:560px){.chips{grid-template-columns:repeat(4,minmax(0,1fr))}.chips .fchip:last-child:nth-child(odd){grid-column:auto}}
.fchip{min-height:44px;padding:8px 10px;border-radius:12px;background:var(--brand-card);border:1px solid var(--brand-line-2);color:var(--brand-text);font-weight:500;font-size:.92rem;line-height:1.2;text-align:center}
.fchip.on{background:var(--brand-accent);border-color:var(--brand-accent);color:#1a0d03;font-weight:700}
.fres{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 6px;color:var(--brand-text-2);font-size:.92rem;min-height:44px}
.fres b{color:var(--brand-text)}
.leer{color:var(--brand-text-2);padding:14px 0}
.uchead{display:flex;gap:14px;align-items:flex-start}
.uchead .ui{width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(125,211,192,.1);color:var(--brand-ok);margin-top:4px}
.pagehead .eyebrow{margin-bottom:4px}
/* Toolkarte */
.tool .tkurz{font-family:var(--brand-font-head);font-weight:500;font-size:1.12rem;color:#dbe3ec;margin:-10px 0 14px}
.tchips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.tchip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:5px 12px;border-radius:999px;font-size:.86rem;font-weight:500;background:var(--brand-card-2);border:1px solid var(--brand-line-2);color:var(--brand-text);text-decoration:none}
.tchip svg.i{width:15px;height:15px}
.tchip.link{color:var(--brand-accent-soft);border-color:rgba(249,115,22,.35);background:rgba(249,115,22,.08)}
.wofuer{border-left:3px solid var(--brand-ok);padding:2px 0 2px 14px;margin:0 0 6px}
.wofuer span{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-ok)}
.wofuer p{margin:2px 0 0;font-size:1.04rem}
.tool .soh{font-size:1.32rem;margin:26px 0 10px}
.tool .bl ol li{font-size:1.06rem}
.passt{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:24px 0 16px}
.passt>span{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-text-2);margin-right:4px}
.probiert{margin:14px 0 4px;background:var(--brand-card-2);color:var(--brand-text);border:1px solid var(--brand-line-2);box-shadow:none}
.probiert:hover{background:#223650}
.probiert.on{background:#163834;border-color:rgba(125,211,192,.5);color:var(--brand-ok)}
/* Hilfe-Karte */
.hilfe{margin:30px 0 10px;padding:18px 16px 16px;border-radius:20px;background:linear-gradient(135deg,rgba(125,211,192,.1),rgba(125,211,192,0) 70%),var(--brand-card);border:1px solid rgba(125,211,192,.3)}
.hilfe .hk{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.hilfe .hk svg.i{color:var(--brand-ok)}
.hilfe h2{font-size:1.12rem;margin:0}
.hilfe .bl p{font-size:.96rem;color:#d3dbe4}
.hilfe .btn{margin-top:4px}
/* Über-Seite: Kontakt-Buttons */
.getcon .btns.kontakt{margin-top:14px}
@media(min-width:700px){.getcon .btns.kontakt{grid-template-columns:repeat(3,1fr)}}

/* ===== FAB & Footer – Skill §10.3, spec/01 §C.10 ===== */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(18px + var(--sab));width:56px;height:56px;border-radius:50%;z-index:50;
  display:flex;align-items:center;justify-content:center;color:var(--brand-text);background:rgba(28,46,64,.86);border:1px solid var(--brand-line-2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 26px -6px rgba(0,0,0,.7)}
.fab svg.i{width:24px;height:24px;stroke-width:2}
.fab[hidden]{display:none}
.fab{transition:transform .3s var(--ease),opacity .3s}
.fab.away{transform:translateY(90px);opacity:0;pointer-events:none}
footer.foot{text-align:center;color:var(--brand-muted);font-size:.8rem;line-height:1.6;padding:34px 16px calc(96px + var(--sab))}
footer.foot a{color:var(--brand-text-2);text-decoration:none}
footer.foot a b{color:var(--brand-text-2);font-weight:700}

/* ===== Dialoge & Toast ===== */
dialog.dlg{border:none;padding:0;background:transparent;color:var(--brand-text);max-width:min(440px,calc(100vw - 32px));width:100%}
dialog.dlg::backdrop{background:rgba(5,10,15,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
dialog.dlg .box{background:var(--brand-card);border:1px solid var(--brand-line-2);border-radius:24px;padding:24px 20px 18px;box-shadow:0 30px 70px -20px rgba(0,0,0,.9);animation:pop .3s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
dialog.dlg .ico{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:rgba(249,115,22,.14);color:var(--brand-accent-soft);margin-bottom:14px}
dialog.dlg .ico svg.i{width:28px;height:28px}
dialog.dlg h2{font-size:1.42rem;margin:0 0 8px}
dialog.dlg p{color:#d3dbe4;margin:0 0 18px}
dialog.dlg .thumb{border-radius:14px;overflow:hidden;aspect-ratio:16/7;margin:0 0 16px;position:relative}
dialog.dlg .thumb img{width:100%;height:100%;object-fit:cover}
dialog.dlg .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(10,18,26,.75))}

/* spec/01 §C.8 – Icon-Helfer */
function ic(n, cls){ const fill = (n==='play'||n==='pause'); return `<svg class="i${fill?' f':''}${cls?' '+cls:''}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]||''}</svg>`; }

/* ================================================================
   2. Datenmodell & Helper (Skill §2.1–2.5)
   ================================================================ */
const DEFAULT_DATA = {
  schemaVersion:1,
  gelesen:{},          /* "k01/brainfact": true */
  checks:{},           /* "k01/mission/1/0": true */
  letzte:{},           /* "k01": "brainfact" */
  anpassung:{titel:null, untertitel:null, startbildId:null},
  toolbox:{ausprobiert:{}},   /* spec/02 §2: "sigh": true */
  theme:'dunkel'       /* spec/00 §9: nur dunkel */
};
const SECTIONS = {     /* Skill §4: Bereiche für Export/Import */
  anpassung:{label:'Anpassung (Titel, Untertitel, Startbild)', keys:['anpassung']},
  fortschritt:{label:'Fortschritt (gelesene Slides, Häkchen, ausprobierte Tools)', keys:['gelesen','checks','letzte','toolbox']}
};
let D = null, BRAND = null, KAP = [], MED = {version:0, dateien:[]};
let EXP = null;        /* Set vorhandener Experiment-Ordner (experimente/index.json); null = unbekannt → alle annehmen */
const INH = {};        /* Kapitelinhalte-Cache: id → {data, beispiel} */
let startbildURL = null;

/* spec/01 §C.6 – localStorage gekapselt (Privatmodus/Vorschau) */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
/* Skill §2.2 – einzige Stelle für Migrationen */
function normalizeData(o){
  const d = JSON.parse(JSON.stringify(DEFAULT_DATA));
  if(!o || typeof o!=='object') return d;
  for(const k of ['gelesen','checks','letzte']) if(o[k] && typeof o[k]==='object') d[k] = Object.assign({}, o[k]);
  if(o.toolbox && typeof o.toolbox==='object' && o.toolbox.ausprobiert && typeof o.toolbox.ausprobiert==='object') d.toolbox.ausprobiert = Object.assign({}, o.toolbox.ausprobiert);
  if(o.anpassung && typeof o.anpassung==='object'){
    for(const k of ['titel','untertitel','startbildId']) if(typeof o.anpassung[k]==='string' && o.anpassung[k].trim()) d.anpassung[k] = o.anpassung[k];
  }
  d.schemaVersion = 1;
  return d;
}
function loadData(){ try{ D = normalizeData(JSON.parse(lsGet(LS_KEY)||'null')); }catch(e){ D = normalizeData(null); } }
function saveData(){ lsSet(LS_KEY, JSON.stringify(D)); }

/* spec/00 §3 – JSON laden (geht durch den Service Worker: network-first) */
async function getJSON(url){
  const r = await fetch(url, {cache:'no-cache'});
  if(!r.ok) throw new Error(url+' → '+r.status);
  return r.json();
}
/* spec/01 §B – Kapitelinhalt; Feld "inhalt" in kapitel.json zeigt vorübergehend auf Beispielinhalt (§E) */
async function inhalt(k){
  if(INH[k.id]) return INH[k.id];
  if(k.status!=='frei') return null;
  const url = k.inhalt || `inhalte/${k.id}.json`;
  try{
    const data = await getJSON(url);
    const slides = (data.slides||[]).filter(s=>s && s.id);
    const tools = (data.tools||[]).filter(t=>t && t.id);
    INH[k.id] = {data:{...data, slides, tools}, beispiel:/beispiel/.test(url)};
  }catch(e){ INH[k.id] = {data:{slides:[], tools:[]}, beispiel:false, fehler:true}; }
  return INH[k.id];
}
const kapById = id => KAP.find(k=>k.id===id);
const kapRouteId = k => k.id.replace(/^k/,'');           /* k01 → "01" */
const kapFromRoute = s => kapById(/^\d+$/.test(s) ? 'k'+s.padStart(2,'0') : s);
const medium = id => (MED.dateien||[]).find(d=>d.id===id);
const fmtMB = b => b>=1e6 ? (b/1e6).toLocaleString('de-DE',{maximumFractionDigits:1})+' MB' : Math.max(1,Math.round(b/1e3))+' KB';
const fmtT = s => { if(!isFinite(s)||s<0) s=0; s=Math.floor(s); const m=Math.floor(s/60), h=Math.floor(m/60); return h? `${h}:${String(m%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}` : `${m}:${String(s%60).padStart(2,'0')}`; };

/* HTML-Escape + Inline-Markup (**fett**, *kursiv*, [Text](url)) – spec/01 §B */
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function inl(s){
  let t = esc(s);
  t = t.replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:|#)[^)\s]+)\)/g,(m,a,u)=>`<a href="${u}"${u[0]==='#'?'':' target="_blank" rel="noopener"'}>${a}</a>`);
  t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>');
  return t;
}

/* Skill §2.5 – IndexedDB für das eigene Startbild */
function idb(){ return new Promise((res,rej)=>{ if(!('indexedDB' in window)) return rej(new Error('kein IndexedDB')); const r=indexedDB.open(IDB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function imgPut(id,blob){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction(IDB_STORE,'readwrite'); t.objectStore(IDB_STORE).put(blob,id); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
async function imgGet(id){ try{ const db=await idb(); return await new Promise(res=>{ const r=db.transaction(IDB_STORE).objectStore(IDB_STORE).get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null); }); }catch(e){ return null; } }
async function imgDel(id){ try{ const db=await idb(); await new Promise(res=>{ const t=db.transaction(IDB_STORE,'readwrite'); t.objectStore(IDB_STORE).delete(id); t.oncomplete=res; t.onerror=res; }); }catch(e){} }
/* Bild verkleinern → JPEG (max. 2000 px) */
function shrink(file,max=2000,q=.84){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const im=new Image(); im.onload=()=>{ const s=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>b?res(b):rej(new Error('toBlob')),'image/jpeg',q); }; im.onerror=()=>{URL.revokeObjectURL(u); rej(new Error('Bild nicht lesbar'));}; im.src=u; }); }
async function ladeStartbild(){
  if(startbildURL){ URL.revokeObjectURL(startbildURL); startbildURL=null; }
  if(D.anpassung.startbildId){ const b = await imgGet(D.anpassung.startbildId); if(b) startbildURL = URL.createObjectURL(b); }
}
const titel = () => D.anpassung.titel || BRAND.titelStandard;
const untertitel = () => D.anpassung.untertitel || BRAND.untertitelStandard;
const startbild = () => startbildURL || BRAND.startbild;

/* Fortschritt – spec/01 §C.2/§C.5 */
const sKey = (k,s) => `${k.id}/${s.id}`;
function fortschritt(k){ const I=INH[k.id]; if(!I) return null;
  if(k.typ==='toolbox'){ const fr=I.data.tools.filter(t=>t.status!=='gesperrt'); if(!fr.length) return null; return {n:fr.length, r:fr.filter(t=>D.toolbox.ausprobiert[t.id]).length}; }
  if(!I.data.slides.length) return null; const n=I.data.slides.length; const r=I.data.slides.filter(s=>D.gelesen[sKey(k,s)]).length; return {n,r}; }
function markRead(k,s){ const key=sKey(k,s); if(!D.gelesen[key]){ D.gelesen[key]=true; saveData(); const sg=document.querySelector(`.segs a[data-sid="${s.id}"]`); if(sg) sg.classList.add('r'); } }

/* ================================================================
   3. Router (Hash) – spec/01 §C.1
   ================================================================ */
function parse(h){
  const raw = (h||'').replace(/^#\/?/,''); const qi = raw.indexOf('?');
  const q = {}; if(qi>=0) for(const [a,b] of new URLSearchParams(raw.slice(qi+1))) q[a]=b;
  const p = (qi>=0?raw.slice(0,qi):raw).split('/').filter(Boolean).map(s=>{ try{ return decodeURIComponent(s); }catch(e){ return s; } });
  if(!p.length) return {name:'start'};
  if(p[0]==='k' && p[1]){
    /* spec/02 §3 – Toolbox-Routen: u/<usecase> · tool/<id> (Alias t/<id>) · alle?dauer=&art= */
    if(p[2]==='u' && p[3]) return {name:'tbuc', kap:p[1], uc:p[3]};
    if((p[2]==='tool'||p[2]==='t') && p[3]) return {name:'tbtool', kap:p[1], tool:p[3], von:q.u||q.von||null};
    if(p[2]==='alle') return {name:'tballe', kap:p[1], q};
    return p[2] ? {name:'slide', kap:p[1], slide:p[2]} : {name:'kap', kap:p[1]};
  }
  if(p[0]==='x' && p[1]) return {name:'x', id:p[1], anker:p[2]||null};
  if(p[0]==='einstellungen') return {name:'einstellungen'};
  if(p[0]==='ueber') return {name:'ueber'};
  return {name:'start'};
}
/* Skill §10.3 – FAB = eine Ebene nach oben */
function parentOf(r){
  switch(r.name){
    case 'slide': case 'tbuc': case 'tballe': return '#/k/'+r.kap;
    case 'tbtool': return r.von==='alle' ? `#/k/${r.kap}/alle` : (r.von ? `#/k/${r.kap}/u/${encodeURIComponent(r.von)}` : '#/k/'+r.kap);
    case 'kap': case 'einstellungen': case 'ueber': return '#/';
    default: return null;
  }
}
let curRoute = {name:'start'}, prevHash = null, lastStartScroll = 0;
async function route(){
  const r = parse(location.hash);
  if(curRoute.name==='start') lastStartScroll = window.scrollY;
  const from = curRoute; curRoute = r;
  stopAudio();
  document.body.classList.toggle('xmode', r.name==='x');
  const fab = document.getElementById('fab'); const par = parentOf(r);
  fab.classList.remove('away'); fab.hidden = !par; fab.innerHTML = ic('back'); fab.dataset.go = par||'';
  const app = document.getElementById('app');
  try{
    if(r.name==='start') await renderStart(app);
    else if(r.name==='kap') await renderKapitel(app, r);
    else if(r.name==='slide') await renderSlide(app, r);
    else if(r.name==='tbuc' || r.name==='tbtool' || r.name==='tballe') await renderToolboxSub(app, r);
    else if(r.name==='x') renderExperiment(app, r);
    else if(r.name==='einstellungen') await renderEinstellungen(app);
    else if(r.name==='ueber') renderUeber(app);
  }catch(e){ console.warn(e); app.innerHTML = `<div class="wrap"><div class="card" style="margin-top:40px"><h2>${ic('warn')} Hier hakt etwas</h2><p class="hint">${esc(e.message||e)}</p><a class="btn" href="#/">Zur Startseite</a></div></div>`; }
  if(r.name==='start' && from.name!=='start' && from.name!=='einstellungen') window.scrollTo(0,lastStartScroll); else if(!(r.name==='slide' && from.name==='slide' && from.slide===r.slide) && !(r.name==='tballe' && from.name==='tballe') && !(from.name==='x' && xRueckScroll(r))) window.scrollTo(0,0);
  if(r.name==='einstellungen' && sessionStorageGet('kk_scroll')==='offline'){ sessionStorageSet('kk_scroll',''); const o=document.getElementById('offline'); if(o) o.scrollIntoView({block:'start'}); }
}
function sessionStorageGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
function sessionStorageSet(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }

/* ================================================================
   4. Render-Funktionen
   ================================================================ */
/* spec/01 §C.10 – Footer überall */
function footer(){ return `<footer class="foot"><a href="#/ueber"><b>Klarkommen</b> – ${esc(BRAND && BRAND.untertitelStandard || 'Mentale Stärke. Klare Richtung.')} · herausgegeben von <b>GetCon</b></a></footer>`; }
/* App-Leiste für Unterseiten */
function bar(titleHtml, extra=''){ return `<header class="bar"><div class="in"><a class="iconbtn" href="#/" aria-label="Startseite">${ic('home')}</a><div class="t">${titleHtml}</div><a class="iconbtn" href="#/einstellungen" aria-label="Einstellungen">${ic('sliders')}</a></div>${extra}</header>`; }
function ringSvg(f){
  const C = 2*Math.PI*19; const p = f && f.n ? f.r/f.n : 0;
  const done = f && f.n && f.r===f.n;
  return `<div class="ring${done?' done':''}" aria-label="${f?`${f.r} von ${f.n} gelesen`:''}"><svg viewBox="0 0 46 46"><circle class="tr" cx="23" cy="23" r="19" fill="none" stroke-width="3.5"/><circle class="pr" cx="23" cy="23" r="19" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-p)).toFixed(1)}"/></svg><span>${done?ic('check'):(f?`${f.r}/${f.n}`:'')}</span></div>`;
}
/* spec/01 §C.2 + §C.3 – Kachel */
function tile(k){
  const locked = k.status!=='frei';
  const eyebrow = k.nr ? `Kapitel ${k.nr}` : 'Bonus';
  const f = fortschritt(k);
  const tag = locked ? `<span class="tag">Vollversion</span>` : (k.typ==='toolbox' ? `<span class="tag">Toolsammlung</span>` : '');
  const attrs = locked ? `data-act="sperre" data-kap="${k.id}"` : `data-go="#/k/${kapRouteId(k)}"`;
  return `<button class="tile${locked?' locked':''}${k.nr?'':' wide'}" ${attrs} aria-label="${esc(eyebrow+': '+k.titel+(locked?' – nicht freigeschaltet':''))}">
    <img src="${esc(k.cover)}" alt="" loading="lazy" decoding="async">
    ${locked?`<span class="lockb glass">${ic('lock')}</span>`:''}
    <span class="tx"><div><div class="eyebrow">${eyebrow}${k.phase && k.nr?`<span class="ph"> · ${esc(k.phase)}</span>`:''}</div><h3>${esc(k.titel)}</h3>${k.untertitel?`<div class="u">${esc(k.untertitel)}</div>`:''}${tag}</div>${(!locked)?`<span data-ring="${k.id}">${ringSvg(f)}</span>`:''}</span>
  </button>`;
}
/* spec/01 §C.2 – Startseite */
async function renderStart(app){
  document.title = titel();
  let html = `<div class="view"><section class="hero">
    <img class="bg" src="${esc(startbild())}" alt="" fetchpriority="high">
    <div class="top"><button class="pill glass" id="opill" data-act="zu-offline"><span class="dot"></span><span id="opillT">Offline-Status …</span></button><a class="iconbtn glass" href="#/einstellungen" aria-label="Einstellungen">${ic('sliders')}</a></div>
    <div class="ttl"><h1>${esc(titel())}</h1><div class="sub">${esc(untertitel())}</div></div>
    <div class="bottom"></div>
  </section>
  <section id="einfuehrung" ${BRAND.features && BRAND.features.einfuehrung ? '' : 'hidden'} class="wrap wide"><!-- Platz für spätere Einführung (Feature-Flag brand.json features.einfuehrung) --></section>
  <section class="wrap wide" aria-labelledby="reiseH">
    <div class="lead"><h2 id="reiseH">Deine Reise</h2><span class="meta">${KAP.filter(k=>k.nr).length} Kapitel + Bonus</span></div>
    <p class="introtxt">Kapitel für Kapitel zu mehr Klarheit. Tippe ein Kapitel an, um loszulegen.</p>
    <div class="reise">`;
  let phase = null;
  for(const k of KAP){
    if(k.phase && k.phase!==phase){ phase = k.phase; const nrs = KAP.filter(x=>x.phase===phase && x.nr).map(x=>x.nr); html += `<div class="phase"><span>${esc(phase)}${nrs.length?` <b>· ${nrs.length>1?nrs[0]+'–'+nrs[nrs.length-1]:nrs[0]}</b>`:''}</span></div>`; }
    html += tile(k);
  }
  html += `</div></section>${footer()}</div>`;
  app.innerHTML = html;
  offlinePill();
  /* Fortschrittsringe nachladen */
  for(const k of KAP.filter(k=>k.status==='frei')){
    inhalt(k).then(()=>{ const el=document.querySelector(`[data-ring="${k.id}"]`); if(el) el.innerHTML = ringSvg(fortschritt(k)); });
  }
}
/* spec/00 §2.2 – nächstes freies Kapitel */
function naechstesKapitel(k){ const i = KAP.indexOf(k); return KAP.slice(i+1).find(x=>x.status==='frei') || null; }
/* spec/01 §C.4 – Kapitelseite */
async function renderKapitel(app, r){
  const k = kapFromRoute(r.kap);
  if(!k){ location.replace('#/'); return; }
  if(k.status!=='frei'){ location.replace('#/'); setTimeout(()=>openSperre(k),50); return; }
  document.title = `${k.titel} · ${titel()}`;
  const eyebrow = k.nr ? `Kapitel ${k.nr}` : 'Bonus';
  const head = `<section class="khead"><img src="${esc(k.cover)}" alt=""><div class="wrap"><div class="eyebrow">${eyebrow}${k.phase?` · ${esc(k.phase)}`:''}</div><h1>${esc(k.titel)}</h1>${k.untertitel?`<div class="u">${esc(k.untertitel)}</div>`:''}</div></section>`;
  if(k.typ==='toolbox'){ await renderToolbox(app, k, head, eyebrow); return; }
  const I = await inhalt(k);
  const S = I.data.slides;
  const f = fortschritt(k) || {n:0,r:0};
  const firstUnread = S.find(s=>!D.gelesen[sKey(k,s)]);
  const last = D.letzte[k.id] && S.find(s=>s.id===D.letzte[k.id]);
  const ziel = (f.r>0 || last) ? (last && !D.gelesen[sKey(k,last)] ? last : (firstUnread||S[0])) : S[0];
  const label = f.r===f.n && f.n ? 'Noch einmal ansehen' : ((f.r>0||last) ? 'Weiter, wo du warst' : 'Los geht’s');
  let html = `<div class="view">${bar(`<b>${eyebrow}</b> · ${esc(k.titel)}`)}${head}<div class="wrap">`;
  if(I.beispiel) html += `<div class="beispiel">${ic('info')}<span>Beispielinhalt – die echten Texte folgen.</span></div>`;
  html += `<div class="kmeta"><span>${ic('layers')} ${S.length} Etappen</span><span>${ic('check')} ${f.r} gelesen</span></div>`;
  if(ziel) html += `<a class="btn block pulse" href="#/k/${kapRouteId(k)}/${encodeURIComponent((f.r===f.n&&f.n?S[0]:ziel).id)}">${label} ${ic('right')}</a>`;
  html += `<ol class="etappen">`;
  for(const s of S){
    const rd = !!D.gelesen[sKey(k,s)]; const nx = !rd && ziel && s.id===ziel.id;
    const rb = RUBRIK[s.rubrik] || {label:s.rubrik, icon:'chev'};
    html += `<li class="etappe${rd?' r':''}${nx?' next':''}"><a href="#/k/${kapRouteId(k)}/${encodeURIComponent(s.id)}"><span class="ic">${ic(rb.icon)}</span><span class="txt"><span class="rb">${esc(rb.label)}</span><div class="tt">${esc(s.titel)}</div></span>${rd?`<span class="ok" aria-label="gelesen">${ic('check')}</span>`:`<span class="chev">${ic('chev')}</span>`}</a></li>`;
  }
  html += `</ol>${I.fehler?`<div class="call wichtig">${ic('warn')}<p>Der Inhalt dieses Kapitels konnte nicht geladen werden. Bist du offline? Dann einmal mit Internet öffnen.</p></div>`:''}</div>${footer()}</div>`;
  app.innerHTML = html;
}
/* Weiter-Karte am Kapitelende */
function naechstWeiter(k){
  const n = naechstesKapitel(k);
  if(!n) return `<a class="weiter end" href="#/" data-endcard><span class="k"><span class="l">Geschafft</span><div class="n">Zurück zu deiner Reise</div></span><span class="go">${ic('home')}</span></a>`;
  return `<a class="weiter end" href="#/k/${kapRouteId(n)}" data-endcard><span class="k"><span class="l">Nächstes Kapitel</span><div class="n">${n.nr?`Kapitel ${n.nr}: `:''}${esc(n.titel)}</div></span><span class="go">${ic('right')}</span></a>`;
}
/* spec/01 §B – Blöcke rendern */
function blocks(arr, ctx){
  let h = ''; const skip = new Set();
  (arr||[]).forEach((b,bi)=>{
    if(!b || !b.typ || skip.has(bi)) return;
    const path = ctx.path+'/'+bi;
    switch(b.typ){
      case 'absatz': h += `<p>${inl(b.text)}</p>`; break;
      case 'ueberschrift': h += `<h2>${inl(b.text)}</h2>`; break;
      case 'liste': { const t = b.geordnet?'ol':'ul'; h += `<${t}>${(b.punkte||[]).map(p=>`<li>${inl(p)}</li>`).join('')}</${t}>`; break; }
      case 'checkliste': h += `<ul class="check">${(b.punkte||[]).map((p,i)=>{ const key=path+'/'+i; return `<li><label><input type="checkbox" data-check="${esc(key)}" ${D.checks[key]?'checked':''}><span class="bx">${ic('check')}</span><span>${inl(p)}</span></label></li>`; }).join('')}</ul>`; break;
      case 'zitat': h += `<blockquote>${inl(b.text)}${b.quelle?`<cite>– ${inl(b.quelle)}</cite>`:''}</blockquote>`; break;
      case 'callout': { const a = b.art||'tipp'; h += `<div class="call ${esc(a)}">${ic(a==='wichtig'?'warn':a==='info'?'info':'spark')}<p>${inl(b.text)}</p></div>`; break; }
      case 'bild': if(!b.src) break; h += `<figure><img src="${esc(b.src)}" alt="${esc(b.alt||'')}" loading="lazy" decoding="async">${b.unterschrift?`<figcaption>${inl(b.unterschrift)}</figcaption>`:''}</figure>`; break;
      case 'audio': h += audioCard(b); break;
      case 'experiment': {
        /* spec/03: mehrere Experimente direkt nacheinander → eine Serien-Karte (z. B. Kap. 1 Einstieg: focus, farbensuche, Pizza) */
        let serie = Array.isArray(b.reihe) ? b.reihe.map(x=>({typ:'experiment', ...x})) : [b];
        for(let j=bi+1; j<arr.length && arr[j] && arr[j].typ==='experiment' && !Array.isArray(arr[j].reihe); j++){ serie.push(arr[j]); skip.add(j); }
        h += serie.length>1 ? expSerie(serie, path) : expKarte(serie[0], path);
        break; }
      case 'akkordeon': h += `<details class="acc"><summary>${ic('chev')}<span>${esc(b.titel)}</span>${ic('down','chv')}</summary><div class="acb bl">${blocks(b.bloecke, {...ctx, path})}</div></details>`; break;
      case 'link': { /* Nachtrag 04.11.: externe Link-Karte (nur Link, nichts wird vorgeladen) */
        if(!/^https:\/\//.test(b.url||'')) break;
        h += `<div class="exp lnk"><div class="art">${ic('play')} ${esc(b.art||'Link')}</div><h3>${esc(b.titel||b.url)}</h3>${b.hinweis?`<p>${inl(b.hinweis)}</p>`:''}<a class="btn sec block" href="${esc(b.url)}" target="_blank" rel="noopener noreferrer">${ic('ext')} ${esc(b.label||'Link öffnen')}</a>${b.online?`<p class="hint lnk-on">${ic('info')} ${esc(b.online)}</p>`:''}</div>`; break; }
      case 'quelle': h += `<div class="quelle">${ic('book')}<div>${inl(b.text)}${b.url?` <a href="${esc(b.url)}" target="_blank" rel="noopener">${ic('ext')}<span class="sr">Link öffnen</span></a>`:''}</div></div>`; break;
      default: console.warn('Unbekannter Blocktyp', b.typ);
    }
  });
  return h;
}
/* spec/01 §C.5 – Audio-Karte */
function audioCard(b){
  const art = AUDIO_ART[b.art] || 'Audio';
  if(b.status==='in-produktion') return `<div class="audio prod"><span class="play">${ic('mic')}</span><div class="meta"><div class="art">${ic('head')} ${art}</div><div class="at">${esc(b.titel||'')}</div><div class="sub">Dieser Podcast ist noch in Produktion.</div></div></div>`;
  const m = medium(b.id);
  if(!m) return `<div class="audio prod"><span class="play">${ic('head')}</span><div class="meta"><div class="art">${ic('head')} ${art}</div><div class="at">${esc(b.titel||'')}</div><div class="sub">Audio folgt in Kürze.</div></div></div>`;
  return `<div class="audio" data-audio="${esc(b.id)}">
    <div class="row"><button class="play" data-act="play" aria-label="Abspielen">${ic('play','pl')}${ic('pause','pa')}</button>
      <div class="meta"><div class="art">${ic('head')} ${art}</div><div class="at">${esc(b.titel||'')}</div><div class="sub"><span>${ic('clock').replace('class="i"','class="i" style="width:15px;height:15px;vertical-align:-3px"')} ${esc(m.dauer||'')}</span><span>${fmtMB(m.bytes)}</span><span class="off" hidden>${ic('check')} offline gespeichert</span></div></div></div>
    <div class="ctl"><button class="skip" data-act="rw" aria-label="15 Sekunden zurück">${ic('rw')}<span>15</span></button>
      <div class="tl"><input type="range" class="seek" min="0" max="1000" value="0" step="1" aria-label="Position"><div class="times"><span class="cur">0:00</span><span class="dur">${esc(m.dauer||'')}</span></div></div>
      <button class="skip" data-act="ff" aria-label="15 Sekunden vor">${ic('ff')}<span>15</span></button></div>
    <audio preload="none" src="${esc(m.pfad)}"></audio></div>`;
}
/* spec/01 §C.5 – Slide */
async function renderSlide(app, r){
  const k = kapFromRoute(r.kap);
  if(!k || k.status!=='frei'){ location.replace('#/'); return; }
  const I = await inhalt(k); const S = I.data.slides;
  const i = S.findIndex(s=>s.id===r.slide);
  if(i<0){ location.replace('#/k/'+kapRouteId(k)); return; }
  const s = S[i], prev = S[i-1], next = S[i+1];
  D.letzte[k.id] = s.id; saveData();
  const rb = RUBRIK[s.rubrik] || {label:s.rubrik, icon:'chev'};
  document.title = `${s.titel} · ${titel()}`;
  const segs = `<nav class="segs" aria-label="Etappen">${S.map((x,j)=>`<a href="#/k/${kapRouteId(k)}/${encodeURIComponent(x.id)}" data-rep="1" data-sid="${esc(x.id)}" class="${j===i?'cur':(D.gelesen[sKey(k,x)]?'r':'')}" aria-label="${esc(x.titel)}"></a>`).join('')}</nav>`;
  const ctx = {k, s, path:`${k.id}/${s.id}`};
  let html = `<div class="view">${bar(`<b>${k.nr?`Kapitel ${k.nr}`:'Bonus'}</b> · ${i+1}/${S.length}`, segs)}
    <div class="shead"><img src="${esc(s.header||k.cover)}" alt=""></div>
    <article class="wrap slide" id="slide"><div class="rubrik">${ic(rb.icon)} ${esc(rb.label)}</div><h1>${esc(s.titel)}</h1>
    ${I.beispiel?`<div class="beispiel" style="margin:-6px 0 18px">${ic('info')}<span>Beispielinhalt – die echten Texte folgen.</span></div>`:''}
    <div class="bl">${blocks(s.bloecke, ctx)}</div>`;
  if(s.lese && s.lese.length) html += `<details class="acc lese"><summary>${ic('book')}<span>Ausführlich lesen (Leseversion)</span>${ic('down','chv')}</summary><div class="acb bl">${blocks(s.lese, {...ctx, path:ctx.path+'/lese'})}</div></details>`;
  if(next) html += `<a class="weiter" href="#/k/${kapRouteId(k)}/${encodeURIComponent(next.id)}" data-rep="1" data-endcard><span class="k"><span class="l">Weiter: ${esc((RUBRIK[next.rubrik]||{}).label||'')}</span><div class="n">${esc(next.titel)}</div></span><span class="go">${ic('right')}</span></a>`;
  else html += naechstWeiter(k);
  if(prev) html += `<a class="zurueck" href="#/k/${kapRouteId(k)}/${encodeURIComponent(prev.id)}" data-rep="1">${ic('up')} Zurück: ${esc(prev.titel)}</a>`;
  else html += `<a class="zurueck" href="#/k/${kapRouteId(k)}">${ic('up')} Zur Kapitelübersicht</a>`;
  html += `</article>${footer()}</div>`;
  app.innerHTML = html;
  /* gelesen beim Erreichen des Endes */
  const end = app.querySelector('[data-endcard]');
  if(end && 'IntersectionObserver' in window){ const io = new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)){ markRead(k,s); io.disconnect(); } },{threshold:.6}); io.observe(end); }
  initAudios(app);
}
/* spec/01 §C.1 – Experiment im Vollbild-iframe mit sticky Leiste */
function renderExperiment(app, r){
  const t = sessionStorageGet('kk_xtitel') || ('Experiment: ' + r.id.replace(/[-_]/g,' ').replace(/^./,c=>c.toUpperCase()));
  document.title = `${t} · ${titel()}`;
  const src = `experimente/${encodeURIComponent(r.id)}/index.html${r.anker?'#'+encodeURIComponent(r.anker):''}`;   /* Deep-Link: {"anker":"klima"} → …/index.html#klima */
  app.innerHTML = `<div class="xview" id="xview"><div class="xbar"><div class="in"><button class="back" data-act="x-zurueck">${ic('back')} Zurück</button><div class="t">${esc(t)}</div></div></div><iframe id="xframe" src="${src}" title="${esc(t)}" allow="autoplay; fullscreen"></iframe></div>`;
  const fr = document.getElementById('xframe');
  /* Experimente mit eigener „Zurück zur App“-Leiste (#kk-bar, sendet postMessage {kk:'zurueck'}) → App-Leiste ausblenden, sonst doppelt */
  fr.addEventListener('load', ()=>{ try{ if(fr.contentDocument && fr.contentDocument.getElementById('kk-bar')) document.getElementById('xview').classList.add('eigenbar'); }catch(e){} });
}
/* Overlay schließen (Zurück-Button oder postMessage aus dem iframe) */

  const key = sessionStorageGet('kk_xkey'); if(key){ D.checks[key] = true; saveData(); }

/* Experiment-Link: #/x/<id>[/<anker>] (Deep-Link → experimente/<id>/index.html#<anker>) */
const expHref = b => `#/x/${encodeURIComponent(b.id)}${b.anker?'/'+encodeURIComponent(b.anker):''}`;
const expDa = id => !EXP || EXP.has(id);
/* einzelne Experiment-Karte – spec/01 §C.5 */
function expKarte(b, path, L){
  L = L || {art:'Experiment', icon:'flask', start:'Experiment starten'};
  const key = `${path}/x/${b.id}`; const done = !!D.checks[key];
  const btn = expDa(b.id) ? `<a class="btn pulse" href="${expHref(b)}" data-xtitel="${esc(b.titel||'')}" data-xkey="${esc(key)}">${done?'Nochmal starten':L.start} ${ic('right')}</a>` : `<span class="btn sec" aria-disabled="true">${ic('clock')} ${esc(L.art)} folgt in Kürze</span>`;
  return `<div class="exp" data-xk="${esc(key)}"><div class="art">${ic(L.icon)} ${esc(L.art)}${done?`<span class="xdone">${ic('check')} gemacht</span>`:''}</div><h3>${esc(b.titel||'Experiment')}</h3>${b.text?`<p>${inl(b.text)}</p>`:''}${btn}</div>`;
}
/* mehrere Experimente nacheinander in einer Slide – spec/03 (Kap. 1 Einstieg) */
function expSerie(serie, path){
  const keys = serie.map(b=>`${path}/x/${b.id}`);
  const nextI = keys.findIndex((k,i)=>!D.checks[k] && expDa(serie[i].id));
  let h = `<div class="exp serie"><div class="art">${ic('flask')} ${serie.length} Experimente nacheinander</div><ol class="xsteps">`;
  serie.forEach((b,i)=>{
    const done = !!D.checks[keys[i]], da = expDa(b.id), cur = i===nextI;
    h += `<li class="xstep${done?' done':''}${cur?' cur':''}" data-xk="${esc(keys[i])}"><span class="xn">${done?ic('check'):i+1}</span><div class="xb"><h3>${esc(b.titel||'Experiment')}</h3>${b.text?`<p>${inl(b.text)}</p>`:''}`
      + (da ? `<a class="btn${cur?' pulse':' sec'}" href="${expHref(b)}" data-xtitel="${esc(b.titel||'')}" data-xkey="${esc(keys[i])}">${done?'Nochmal':'Starten'} ${ic('right')}</a>` : `<span class="soon">${ic('clock')} Folgt in Kürze</span>`)
      + `</div></li>`;
  });
  return h + `</ol></div>`;
}

/* Dauer-Anzeige: dauerText vor dauerMin; beides null → nichts anzeigen (Auftrag) */

  if(t.dauerText) return t.dauerText;
  const m = t.dauerMin; if(m==null || !isFinite(m)) return null;
  if(m < 1) return `${Math.max(5, Math.round(m*60/5)*5)} s`;

}

function tbFilter(el){

   ================================================================ */
let audioCur = null;
function stopAudio(){ document.querySelectorAll('.audio audio').forEach(a=>{ try{ a.pause(); }catch(e){} }); audioCur = null; }
function initAudios(root){
  root.querySelectorAll('.audio[data-audio]').forEach(card=>{
    const a = card.querySelector('audio'), seek = card.querySelector('.seek'), cur = card.querySelector('.cur'), dur = card.querySelector('.dur');
    let dragging = false;
    const upd = ()=>{ if(!dragging && a.duration){ const v = a.currentTime/a.duration*1000; seek.value = v; seek.style.setProperty('--p', (v/10)+'%'); } cur.textContent = fmtT(a.currentTime); };
    a.addEventListener('timeupdate', upd);
    a.addEventListener('loadedmetadata', ()=>{ if(isFinite(a.duration)) dur.textContent = fmtT(a.duration); upd(); });
    a.addEventListener('play', ()=>{ card.classList.add('on'); card.querySelector('.play').setAttribute('aria-label','Pause'); });
    a.addEventListener('pause', ()=>{ card.classList.remove('on'); card.querySelector('.play').setAttribute('aria-label','Abspielen'); });
    a.addEventListener('ended', ()=>{ a.currentTime = 0; upd(); });
    a.addEventListener('error', ()=>toast('Audio konnte nicht geladen werden. Bist du offline? Dann vorher „Offline speichern“ nutzen.'));
    seek.addEventListener('input', ()=>{ dragging = true; seek.style.setProperty('--p', (seek.value/10)+'%'); if(a.duration) cur.textContent = fmtT(seek.value/1000*a.duration); });
    seek.addEventListener('change', ()=>{ dragging = false; if(a.duration) a.currentTime = seek.value/1000*a.duration; });
    istOffline(a.getAttribute('src')).then(ok=>{ const o = card.querySelector('.off'); if(o) o.hidden = !ok; });
  });
}
function audioAct(card, act){
  const a = card.querySelector('audio');
  if(act==='play'){
    if(a.paused){ document.querySelectorAll('.audio audio').forEach(x=>{ if(x!==a) x.pause(); }); a.play().catch(e=>{ console.warn(e); toast('Abspielen nicht möglich.'); }); audioCur = a; }
    else a.pause();
  }
  if(act==='rw') a.currentTime = Math.max(0, a.currentTime-15);
  if(act==='ff') a.currentTime = Math.min(a.duration||0, a.currentTime+15);
}

/* ================================================================
   6. Offline – spec/01 §C.7, Skill §5a
   ================================================================ */
const absURL = p => new URL(p, location.href.split('#')[0]).href;
async function istOffline(pfad){ try{ if(!('caches' in window)) return false; const c = await caches.open(MEDIEN_CACHE); return !!(await c.match(absURL(pfad))); }catch(e){ return false; } }
async function offlineZaehlen(){
  const F = MED.dateien||[]; let n=0, b=0, tb=0;
  for(const f of F){ tb += f.bytes; if(await istOffline(f.pfad)){ n++; b += f.bytes; } }
  return {n, gesamt:F.length, bytes:b, totalBytes:tb};
}
async function offlinePill(){
  const p = document.getElementById('opill'), t = document.getElementById('opillT'); if(!p) return;
  const z = await offlineZaehlen();
  p.classList.remove('ok','todo','off');
  if(!navigator.onLine){ p.classList.add(z.n===z.gesamt?'ok':'off'); t.textContent = z.n===z.gesamt ? 'Offline · alles gespeichert' : 'Offline'; return; }
  if(z.gesamt && z.n===z.gesamt && navigator.serviceWorker && navigator.serviceWorker.controller){ p.classList.add('ok'); t.textContent = 'Offline bereit'; }
  else { p.classList.add('todo'); t.textContent = 'Offline speichern'; }
}
let oAbort = null;
async function offlineStatus(){
  const st = document.getElementById('oStat'); if(!st) return;
  const z = await offlineZaehlen();
  st.innerHTML = `Offline verfügbar: <b>${z.n} von ${z.gesamt}</b> Dateien`;
  document.getElementById('oSize').textContent = `${fmtMB(z.bytes)} / ${fmtMB(z.totalBytes)}`;
  document.getElementById('oBar').style.width = (z.gesamt? z.n/z.gesamt*100 : 0)+'%';
  const btn = document.getElementById('oBtn');
  if(!oAbort){
    const rest = z.gesamt - z.n, restB = z.totalBytes - z.bytes;
    btn.innerHTML = rest ? `${ic('dl')} ${z.n?'Fehlende':'Alles'} offline speichern – ${rest} Dateien · ca. ${fmtMB(restB)} (WLAN)` : `${ic('check')} Alles offline gespeichert`;
    btn.disabled = !rest; btn.classList.toggle('sec', !rest); btn.classList.toggle('pulse', !!rest);
  }
  const sw = navigator.serviceWorker && navigator.serviceWorker.controller ? 'aktiv' : ('serviceWorker' in navigator ? 'noch nicht aktiv – Seite einmal neu laden' : 'vom Browser nicht unterstützt');
  let est = '';
  try{ if(navigator.storage && navigator.storage.estimate){ const e = await navigator.storage.estimate(); est = `${fmtMB(e.usage||0)} belegt`; } }catch(e){}
  let pers = '';
  try{ if(navigator.storage && navigator.storage.persisted) pers = (await navigator.storage.persisted()) ? 'ja' : 'nein'; }catch(e){}
  document.getElementById('oKv').innerHTML = `<span>App-Grundgerüst offline</span><b>${sw}</b>${est?`<span>Speicher</span><b>${est}</b>`:''}${pers?`<span>Dauerhaft geschützt</span><b>${pers}</b>`:''}`;
}
async function offlineLaden(){
  if(!('caches' in window)){ toast('Dieser Browser kann keine Offline-Daten speichern.'); return; }
  try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  const btn = document.getElementById('oBtn'), ab = document.getElementById('oAbbr'), st = document.getElementById('oStat'), barEl = document.getElementById('oBar');
  oAbort = new AbortController(); btn.disabled = true; btn.classList.remove('pulse'); ab.hidden = false;
  const F = MED.dateien||[]; const c = await caches.open(MEDIEN_CACHE);
  let fertig = 0, fehler = 0;
  for(const f of F){
    if(oAbort.signal.aborted) break;
    const u = absURL(f.pfad);
    try{
      if(!(await c.match(u))){
        btn.innerHTML = `Lade ${fertig+1} von ${F.length} …`;
        const r = await fetch(u, {signal:oAbort.signal, cache:'no-cache'});
        if(!r.ok) throw new Error(r.status);
        await c.put(u, r);
      }
    }catch(e){ if(oAbort.signal.aborted) break; fehler++; console.warn('Offline-Laden fehlgeschlagen:', f.pfad, e); }
    fertig++;
    st.innerHTML = `Offline verfügbar: <b>${fertig-fehler} von ${F.length}</b> Dateien`; barEl.style.width = (fertig/F.length*100)+'%';
  }
  const abgebrochen = oAbort.signal.aborted; oAbort = null; ab.hidden = true;
  await offlineStatus();
  toast(abgebrochen ? 'Abgebrochen. Bereits Gespeichertes bleibt erhalten.' : (fehler ? `${fehler} Datei(en) konnten nicht geladen werden – bitte erneut versuchen.` : 'Fertig – Klarkommen ist jetzt offline verfügbar.'));
}
async function offlineReset(){
  if(!(await ask('Offline-Daten zurücksetzen?','Gespeicherte Bilder und Audios werden von diesem Gerät gelöscht und die App wird neu geladen. Dein Fortschritt bleibt erhalten.','Zurücksetzen'))) return;
  try{ for(const n of await caches.keys()) if(n.startsWith('kk-')) await caches.delete(n); }catch(e){}
  try{ if(navigator.serviceWorker) for(const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); }catch(e){}
  location.reload();
}

async function exportieren(){

  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `klarkommen-sicherung-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);

async function importieren(file){

  const nT = Object.keys((fs.toolbox&&fs.toolbox.ausprobiert)||{}).length;
  const vorschau = `${nG} gelesene Slides · ${nC} Häkchen · ${nT} ausprobierte Tools${j.anpassung && j.anpassung.titel?` · Titel „${j.anpassung.titel}“`:''}${j._images&&j._images.startbild?' · eigenes Startbild':''}. Dein aktueller Stand auf diesem Gerät wird dabei ersetzt.`;
  if(!(await ask('Sicherung importieren?', vorschau, 'Importieren'))) return;
  const neu = normalizeData({gelesen:fs.gelesen, checks:fs.checks, letzte:fs.letzte, toolbox:fs.toolbox, anpassung:j.anpassung});

  D = neu; saveData(); await ladeStartbild(); toast('Import abgeschlossen.'); route();
}

  loadData();
  try{
    const [b, kj, mj, xj] = await Promise.all([getJSON('brand/brand.json'), getJSON('inhalte/kapitel.json'), getJSON('medien.json').catch(()=>({version:0, dateien:[]})), getJSON('experimente/index.json').catch(()=>null)]);
    BRAND = b; KAP = (kj.kapitel||[]); MED = mj;
    if(xj){ const arr = Array.isArray(xj) ? xj : (xj.experimente||[]); EXP = new Set(arr.map(e=>typeof e==='string'?e:(e&&e.id)).filter(Boolean)); }
  }catch(e){
    document.getElementById('app').innerHTML = `<div class="wrap" style="padding-top:60px"><h1>Klarkommen</h1><p>Die App konnte nicht geladen werden. Bitte einmal mit Internetverbindung öffnen.</p><p style="color:var(--brand-text-2);font-size:.9rem">${esc(e.message)}</p></div>`;
    return;
  }
  document.body.classList.remove('sv-a','sv-b','sv-c'); document.body.classList.add('sv-'+(BRAND.sperrVariante||'b'));
  await ladeStartbild();
  route();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(()=>{}).catch(e=>console.warn('SW-Registrierung fehlgeschlagen', e));
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(curRoute.name==='start') offlinePill(); if(curRoute.name==='einstellungen') offlineStatus(); });
  }
}
init();
</script>
</body>
</html>
